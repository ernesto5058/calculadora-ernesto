name: TiendaMaximo
options:
  bundleIdPrefix: com.maximo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SideSign:
    url: https://github.com/SideStore/SideSign
    branch: main
  Minimuxer:
    path: vendor/minimuxer
targets:
  TiendaMaximo:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SideSign
        product: SideSign
      - package: Minimuxer
        product: Minimuxer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maximo.tienda
        PRODUCT_NAME: TiendaMaximo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "Tienda Máximo"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchStoryboardName: ""
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
