rules:
  # ─────────────────────────────────────────────────────────────────────────
  # Origen: DESARROLLO-PRO §1 regla 6 + §8 + AGENTS.md «LLAVERO
  # AUTOMÁTICO» — el repo es PÚBLICO y «lo público es público para
  # siempre (el historial de git no olvida)». Esta regla generic caza
  # prefijos de credencial de alta entropía en CUALQUIER archivo
  # (js, py, sh, json, md…): son formatos cerrados de proveedor, así que
  # un acierto es casi siempre una credencial real. No caza «parece un
  # secreto»: caza formatos. Los valores de los casos son ficticios y
  # están truncados a propósito.
  - id: casa-secreto-prefijo-conocido
    languages: [generic]
    severity: ERROR
    message: >-
      Formato de credencial real detectado en un archivo (DESARROLLO-PRO
      §8): el repo es público y el historial no olvida. Saca el valor ya,
      rótalo con el proveedor y guárdalo en el llavero seguro
      (~/workspace/.secure/) o en secrets de Actions. Nunca pegues el
      valor en el chat ni en la ficha: solo archivo:línea y tipo.
    metadata:
      origen: "DESARROLLO-PRO §1.6 / §8 + AGENTS.md llavero automático"
      precision: "probada — ver casos/casa-secretos.generic (valores ficticios truncados)"
    # La alternativa PRIVATE KEY exige cabecera + cuerpo base64 en la
    # línea siguiente: la cabecera sola aparece en código legítimo que
    # la retira al cargar una llave (falso positivo real cazado en
    # supabase/functions/avisos/index.ts:193, ver ficha).
    paths:
      exclude:
        - "**/.semgrep/casos/**"
    pattern-regex: "(sb_secret_[A-Za-z0-9_\\-]{8,}|sbp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----\\s*\\n[A-Za-z0-9+/=]{20,})"
    # Sin paths.exclude a propósito: al aplicarse, la regla corre sobre el
    # repo (que no contiene la carpeta casos/ del staging). Los casos de
    # prueba llevan valores ficticios truncados y viven fuera del repo.
