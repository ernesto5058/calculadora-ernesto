# Sin org.gradle.jvmargs a propósito: en esta VM el demonio bifurcado de Gradle
# no logra hablar con el cliente; la memoria se fija con GRADLE_OPTS en build-apk.sh
# y el build corre en el propio proceso (--no-daemon real).
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=false
kotlin.code.style=official
