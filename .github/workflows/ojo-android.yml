name: Ojo Android

# OJO ANDROID (aprobado por Ernesto 2026-11-11): monta la APK de «Mi Trabajo»
# — la MISMA del release que recibe un buscador — en un teléfono Android
# virtual (emulador en los runners de GitHub, gratis: repo público), la
# recorre tocando sus pantallas y deja las capturas publicadas en Pages
# bajo ojo-android/ para verlas desde cualquier teléfono, sin login.
# No sustituye la prueba en un teléfono físico: caza los errores de
# arranque, de diseño y de navegación ANTES de entregar la APK.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release de la APK a probar (ej. apk-v1.4.6). Vacío = la última apk-v*'
        required: false
        default: ''
        type: string
      codigo_prueba:
        description: 'Código de una cuenta de prueba para el recorrido interior. Vacío = solo hasta la puerta'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: ojo-android
  cancel-in-progress: false

jobs:
  ojo:
    name: Recorrido en el teléfono virtual
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Resolver la versión y descargar la APK del release
        id: apk
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases?per_page=30" | python3 -c "import sys,json; rs=json.load(sys.stdin); t=[r['tag_name'] for r in rs if r['tag_name'].startswith('apk-v')]; print(t[0] if t else '')")
          fi
          if [ -z "$VER" ]; then echo "No se encontró ningún release apk-v*"; exit 1; fi
          URL=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VER" | python3 -c "import sys,json; r=json.load(sys.stdin); a=[x['browser_download_url'] for x in r['assets'] if x['name'].endswith('.apk')]; print(a[0] if a else '')")
          if [ -z "$URL" ]; then echo "El release $VER no trae APK"; exit 1; fi
          curl -sL -o app.apk "$URL"
          ls -la app.apk
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "## Ojo Android — Mi Trabajo $VER" >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar el recorrido (guion + toques por texto)
        run: |
          mkdir -p ojo
          cat > ojo/tap.py <<'PYEOF2'
          import subprocess, sys, re, time
          # Toca el elemento cuyo texto o descripción coincide (uiautomator).
          def dump():
              subprocess.run(["adb","shell","uiautomator","dump","/sdcard/w.xml"], capture_output=True)
              subprocess.run(["adb","pull","/sdcard/w.xml","/tmp/w.xml"], capture_output=True)
              try:
                  return open("/tmp/w.xml", encoding="utf-8", errors="ignore").read()
              except Exception:
                  return ""
          def centro(b):
              m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", b or "")
              if not m: return None
              x1,y1,x2,y2 = map(int, m.groups())
              return ((x1+x2)//2, (y1+y2)//2)
          def buscar(xml, txt):
              # Arnés v1.7: el WebView expone nodos FANTASMA de las vistas
              # ocultas con bounds [0,0][0,0] — tocarlos es tocar la esquina
              # (0,0): no pasa nada y el toque «cuenta» como bueno. Se
              # ignoran los nodos sin área o fuera de pantalla y, entre los
              # reales, gana el más bajo (la barra de pestañas vive abajo).
              exacto, parcial = None, None
              for tag in re.findall(r"<node [^>]*>", xml):
                  attrs = dict(re.findall(r'([\w-]+)="([^"]*)"', tag))
                  t = attrs.get("text","") or attrs.get("content-desc","")
                  if not t: continue
                  m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", attrs.get("bounds","") or "")
                  if not m: continue
                  x1,y1,x2,y2 = map(int, m.groups())
                  if x2-x1 <= 0 or y2-y1 <= 0: continue
                  c = ((x1+x2)//2, (y1+y2)//2)
                  if c[0] < 10 or c[1] < 10: continue
                  if t == txt:
                      if exacto is None or c[1] > exacto[1]: exacto = c
                  elif txt in t:
                      if parcial is None or c[1] > parcial[1]: parcial = c
              return exacto or parcial
          objetivo = sys.argv[1]
          for _ in range(4):
              c = buscar(dump(), objetivo)
              if c:
                  subprocess.run(["adb","shell","input","tap",str(c[0]),str(c[1])])
                  print("tap", objetivo, c)
                  sys.exit(0)
              time.sleep(2)
          print("NO ENCONTRADO:", objetivo)
          sys.exit(1)
          PYEOF2
          cat > ojo/recorrido.sh <<'SHEOF'
          #!/usr/bin/env bash
          # Recorrido del Ojo Android DENTRO del emulador. Nunca sale con error:
          # el veredicto viaja en ojo-android/veredicto.txt y lo publica el
          # paso siguiente; una caída de la app = ROJO, no un job mudo.
          PKG=cu.ernesto.mitrabajo
          OUT="$GITHUB_WORKSPACE/ojo-android"
          CAP="$OUT/capturas"
          mkdir -p "$CAP"
          MAN="$OUT/capturas.txt"; : > "$MAN"
          VERED="VERDE"
          FALLOS=0
          DET="La app instaló, abrió y respondió en el teléfono virtual, sin caídas."
          EXTRA=""
          rm -f "$CAP"/*.png
          adb shell settings put global stay_on_while_plugged_in 7 >/dev/null 2>&1
          adb shell settings put system screen_off_timeout 1800000 >/dev/null 2>&1
          adb shell wm dismiss-keyguard >/dev/null 2>&1
          echo "${VERSION_APK}" > "$OUT/version.txt"
          shot(){ adb exec-out screencap -p > "$CAP/$1" 2>/dev/null; echo "$1|$2" >> "$MAN"; sleep 1; }
          dumpw(){ adb shell uiautomator dump /sdcard/w.xml >/dev/null 2>&1; adb pull /sdcard/w.xml /tmp/w.xml >/dev/null 2>&1; }
          sin_dialogos(){ # Arnés v1.5: quita los diálogos del SISTEMA que tapan la app (ANR «Pixel Launcher isn't responding» de la corrida 43129480421, permiso de notificaciones de la 43128713939): el dump solo ve el diálogo y cualquier juicio sobre la app sale falso.
            local i
            for i in 1 2 3; do
              dumpw
              if grep -qiE "isn't responding|no responde" /tmp/w.xml 2>/dev/null; then
                python3 ojo/tap.py "Wait" || python3 ojo/tap.py "Esperar" || adb shell input keyevent 4 >/dev/null 2>&1; sleep 2
                EXTRA="$EXTRA Un diálogo de «app no responde» del sistema tapaba la pantalla y se descartó (Wait)."
              elif grep -qiE "send you notifications|to send you|notificaciones" /tmp/w.xml 2>/dev/null; then
                python3 ojo/tap.py "Don’t allow" || python3 ojo/tap.py "Don't allow" || python3 ojo/tap.py "No permitir" || adb shell input keyevent 4 >/dev/null 2>&1; sleep 2
                EXTRA="$EXTRA El diálogo de permiso de notificaciones apareció y se descartó antes de juzgar."
              else
                return 0
              fi
            done
          }
          wait_text(){ local i; for i in $(seq 1 "$2"); do dumpw; if grep -q "$1" /tmp/w.xml 2>/dev/null; then return 0; fi; sleep 2; done; return 1; }
          gone_text(){ local i; for i in $(seq 1 "$2"); do dumpw; if ! grep -q "$1" /tmp/w.xml 2>/dev/null; then return 0; fi; sleep 2; done; return 1; }
          winsize(){ adb shell wm size 2>/dev/null | grep -oE '[0-9]+x[0-9]+' | head -1; }
          tap_tabla(){ # x_frac y_frac sobre el tamaño de pantalla
            local S=$(winsize); local W=${S%x*}; local H=${S#*x}
            local X=$(python3 -c "print(int($W*$1))"); local Y=$(python3 -c "print(int($H*$2))")
            adb shell input tap "$X" "$Y"
          }
          tap_tab(){ # $1 texto, $2 índice de pestaña (0..5) para el plan B
            if python3 ojo/tap.py "$1"; then return 0; fi
            adb shell input swipe 250 2270 950 2270 250 >/dev/null 2>&1; sleep 1
            if python3 ojo/tap.py "$1"; then return 0; fi
            adb shell input swipe 950 2270 250 2270 250 >/dev/null 2>&1; sleep 1
            if python3 ojo/tap.py "$1"; then return 0; fi
            adb shell input keyevent 4 >/dev/null 2>&1; sleep 1
            if python3 ojo/tap.py "$1"; then return 0; fi
            local FRAC=$(python3 -c "print(($2+0.5)/6)")
            tap_tabla "$FRAC" 0.955
          }
          ir_pantalla(){ # Arnés v1.6: $1 pestaña, $2 índice, $3 marcador propio de la pantalla, $4 foto, $5 pie. Toca y VERIFICA que la pantalla cambió (marcador visible); reintenta con toque por fracción y deslizando la barra. Si no responde, la foto sale con pie honesto y cuenta el fallo.
            tap_tab "$1" "$2"; sleep 3
            if ! wait_text "$3" 6; then
              tap_tab "$1" "$2"; sleep 3
              wait_text "$3" 6 || true
            fi
            dumpw
            if grep -q "$3" /tmp/w.xml 2>/dev/null; then
              shot "$4" "$5"
            else
              FALLOS=$((FALLOS+1))
              shot "$4" "$5 (la pestaña no respondió al toque en el teléfono virtual: la foto muestra la pantalla donde quedó el recorrido)"
            fi
          }
          echo "== Instalando $VERSION_APK =="
          if ! adb install -r "$GITHUB_WORKSPACE/app.apk" 2>&1 | tail -2; then
            VERED="ROJO"; DET="La APK del release no se pudo instalar en el teléfono virtual."
          else
            adb logcat -c >/dev/null 2>&1
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
            sleep 8
            sin_dialogos
            if ! wait_text "código personal" 20; then sin_dialogos; fi
            if wait_text "código personal" 20; then
              shot "01-puerta.png" "La puerta de acceso: la app pide el código personal"
              # --- Código inválido: tiene que rechazarlo con su aviso ---
              python3 ojo/tap.py "Ej: NOMBRE-123" || python3 ojo/tap.py "Tu código personal" || tap_tabla 0.5 0.57
              sleep 1
              adb shell input text "INVALIDO-000"
              sleep 1
              python3 ojo/tap.py "Entrar" || tap_tabla 0.5 0.68
              sleep 7
              shot "02-codigo-invalido.png" "Código inválido: la app lo rechaza con su aviso, sin dejar entrar"
              dumpw
              if grep -qiE "no aparece|no es válido|incorrect|no existe|no autorizado|revísalo|revisa" /tmp/w.xml; then
                EXTRA="El aviso de código inválido se vio en pantalla."
              fi
              # --- Recorrido interior con la cuenta de prueba ---
              if [ -n "${CODIGO_PRUEBA:-}" ]; then
                adb shell am force-stop "$PKG" >/dev/null 2>&1
                adb shell pm clear "$PKG" >/dev/null 2>&1; sleep 1
                adb shell am start -n "$PKG/.MainActivity" >/dev/null 2>&1; sleep 10
                adb shell wm dismiss-keyguard >/dev/null 2>&1; adb shell input keyevent 82 >/dev/null 2>&1; sleep 1
                if [ -z "$(adb shell pidof "$PKG" 2>/dev/null)" ]; then adb shell am start -n "$PKG/.MainActivity" >/dev/null 2>&1; sleep 10; fi
                if wait_text "código personal" 20; then
                  python3 ojo/tap.py "Ej: NOMBRE-123" || python3 ojo/tap.py "Tu código personal" || tap_tabla 0.5 0.565
                  sleep 1
                  adb shell input text "${CODIGO_PRUEBA}"
                  sleep 2
                  dumpw
                  if grep -q "${CODIGO_PRUEBA}" /tmp/w.xml 2>/dev/null; then EXTRA="$EXTRA El código de prueba quedó escrito en el campo antes de tocar Entrar."; fi
                  python3 ojo/tap.py "Entrar" || tap_tabla 0.5 0.63
                  sleep 8
                  # Arnés v1.4/v1.5: tras tocar Entrar puede haber diálogos
                  # del sistema sobre la app: se quitan antes de juzgar.
                  sin_dialogos
                  if gone_text "Tu código personal" 25 && wait_text "Reportar" 10; then
                    shot "03-entrada.png" "Dentro: la primera pantalla tras entrar con la cuenta de prueba"
                    dumpw; cp /tmp/w.xml "$GITHUB_WORKSPACE/dump-entrada.xml" 2>/dev/null || true
                    # Arnés v1.9: el árbol de accesibilidad del WebView tarda
                    # minutos en poblarse en este emulador (las pestañas
                    # nacen con bounds [0,0]: corridas v1.6/v1.7). Se espera
                    # a que las SEIS tengan bounds reales antes del tour.
                    for i in $(seq 1 18); do dumpw; if python3 ojo/arbol.py; then break; fi; sleep 10; done
                    dumpw; cp /tmp/w.xml "$GITHUB_WORKSPACE/dump-tour.xml" 2>/dev/null || true
                    ir_pantalla "Reportar" 1 "Reportar una búsqueda" "04-reportar.png" "Pestaña Reportar: reportar un trato de saldo o transferencia"
                    ir_pantalla "Mi panel" 2 "TOTAL GANADO" "05-mi-panel.png" "Pestaña Mi panel: sus tratos, su comisión y su bono"
                    ir_pantalla "Chat" 3 "¿Para qué es esta app?" "06-chat.png" "Pestaña Chat: la conversación con Ernesto"
                    ir_pantalla "Textos" 4 "Textos de ofertas" "07-textos.png" "Pestaña Textos: sus textos listos para copiar o mandar"
                    ir_pantalla "Mi perfil" 5 "Esto es lo que Ernesto ve de ti" "08-mi-perfil.png" "Pestaña Mi perfil: su cuenta y su enlace personal"
                    if [ "$FALLOS" -eq 0 ]; then
                      EXTRA="$EXTRA El recorrido interior con la cuenta de prueba se completó, pantalla por pantalla verificada."
                    else
                      VERED="PARCIAL"
                      DET="La app entró con la cuenta de prueba y no se cayó, pero $FALLOS pestaña(s) no respondieron al toque en el teléfono virtual; sus fotos muestran la pantalla donde quedó el recorrido."
                      EXTRA="$EXTRA Recorrido interior hecho con $FALLOS pestaña(s) sin responder."
                    fi
                  else
                    VERED="PARCIAL"
                    DET="Con la app recién reabierta, el código de prueba tampoco entró: se quedó en la puerta. La puerta y el rechazo del código inválido sí quedaron probados."
                    shot "03-sin-entrar.png" "Con la app recién reabierta, la cuenta de prueba tampoco entró: se quedó en la puerta"
                  fi
                else
                  VERED="PARCIAL"
                  DET="Al reabrir la app para el recorrido interior, la puerta no apareció en el teléfono virtual. La puerta y el rechazo del código inválido sí quedaron probados en la primera parte."
                  shot "03-sin-puerta.png" "Al reabrir la app, la puerta no apareció"
                fi
              else
                EXTRA="$EXTRA Sin código de prueba: el recorrido llegó hasta la puerta."
              fi
            else
              VERED="ROJO"; DET="La app no mostró la puerta de acceso en el teléfono virtual (¿no arrancó o tardó demasiado?)."
              shot "01-sin-puerta.png" "La app no llegó a mostrar la puerta de acceso"
            fi
            # --- Caídas: logcat del paquete ---
            adb logcat -d > "$GITHUB_WORKSPACE/logcat.txt" 2>/dev/null
            if grep -A4 "FATAL EXCEPTION" "$GITHUB_WORKSPACE/logcat.txt" 2>/dev/null | grep -q "$PKG"; then
              VERED="ROJO"; DET="La app se cayó durante el recorrido (error fatal del paquete en el registro del teléfono virtual)."
            fi
          fi
          echo "$VERED" > "$OUT/veredicto.txt"
          echo "$DET $EXTRA" > "$OUT/detalle.txt"
          echo "Veredicto: $VERED — $DET $EXTRA"
          SHEOF
          cat > ojo/arbol.py <<'PYEOF3'
          import re, sys
          # ¿Tienen las SEIS pestañas un nodo con bounds de área real?
          try: xml = open("/tmp/w.xml", encoding="utf-8", errors="ignore").read()
          except Exception: sys.exit(1)
          labels = ["Calculadora", "Reportar", "Mi panel", "Chat", "Textos", "Mi perfil"]
          ok = {}
          for tag in re.findall(r"<node [^>]*>", xml):
              attrs = dict(re.findall(r'([\w-]+)="([^"]*)"', tag))
              t = attrs.get("text","") or attrs.get("content-desc","")
              if t not in labels: continue
              m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", attrs.get("bounds","") or "")
              if not m: continue
              x1,y1,x2,y2 = map(int, m.groups())
              if x2-x1 > 0 and y2-y1 > 0: ok[t] = True
          sys.exit(0 if len(ok) == len(labels) else 1)
          PYEOF3
          chmod +x ojo/recorrido.sh ojo/tap.py
          ls -la ojo/

      - name: Habilitar KVM (aceleración del teléfono virtual)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Encender el teléfono virtual y hacer el recorrido
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VERSION_APK: ${{ steps.apk.outputs.version }}
          CODIGO_PRUEBA: ${{ inputs.codigo_prueba }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072 -no-snapshot-save
          disable-animations: true
          script: bash ojo/recorrido.sh

      - name: Generar el índice de capturas (Pages)
        if: always()
        run: |
          python3 - <<'PYEOF3'
          import os, datetime
          out = "ojo-android"
          os.makedirs(out + "/capturas", exist_ok=True)
          def leer(p, defecto=""):
              try:
                  return open(os.path.join(out, p), encoding="utf-8").read().strip()
              except Exception:
                  return defecto
          ver = leer("version.txt", "—")
          veredicto = leer("veredicto.txt", "SIN RESULTADO")
          detalle = leer("detalle.txt", "")
          caps = []
          for linea in leer("capturas.txt").splitlines():
              if "|" in linea:
                  f, c = linea.split("|", 1)
                  if os.path.exists(os.path.join(out, "capturas", f)):
                      caps.append((f, c))
          try:
              from zoneinfo import ZoneInfo
              ahora = datetime.datetime.now(ZoneInfo("America/Havana")).strftime("%d-%m-%Y · %I:%M %p")
          except Exception:
              ahora = datetime.datetime.utcnow().strftime("%d-%m-%Y · %H:%M UTC")
          color = {"VERDE": "#3FB96B", "PARCIAL": "#E8B84B", "ROJO": "#E5534B"}.get(veredicto, "#9AA4B2")
          figs = "\n".join(
              '<figure><img src="capturas/%s" alt="%s" loading="lazy"><figcaption>%s</figcaption></figure>' % (f, c, c)
              for f, c in caps)
          html = """<!DOCTYPE html>
          <html lang="es"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Ojo Android — Mi Trabajo %s</title>
          <style>
            :root{--bg:#0B0E13;--card:#12161F;--borde:#232B3A;--txt:#EDF1F7;--mut:#9AA4B2;--oro1:#F5D67B;--oro2:#E8B84B;--oro3:#C9962E}
            *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
            .envoltura{max-width:560px;margin:0 auto;padding:20px 16px 48px}
            h1{font-size:24px;margin:0 0 4px} h1 .oro{background:linear-gradient(120deg,var(--oro1),var(--oro2),var(--oro3));-webkit-background-clip:text;background-clip:text;color:transparent}
            .mut{color:var(--mut);font-size:14px;line-height:1.45}
            .sello{display:inline-block;margin:14px 0 6px;padding:6px 14px;border-radius:999px;font-weight:700;letter-spacing:.04em;border:1px solid %s;color:%s}
            figure{margin:22px 0;background:var(--card);border:1px solid var(--borde);border-radius:16px;overflow:hidden}
            figure img{width:100%%;display:block}
            figcaption{padding:12px 14px;font-size:14px;color:var(--mut);line-height:1.45}
            .pie{margin-top:28px;font-size:13px;color:var(--mut);line-height:1.5}
          </style></head><body><div class="envoltura">
          <h1>Ojo Android · <span class="oro">Mi Trabajo %s</span></h1>
          <div class="mut">Recorrido automático en un teléfono Android virtual (Pixel · Android 14) con la APK exacta del release. %s (hora de Cuba).</div>
          <div class="sello">%s</div>
          <div class="mut">%s</div>
          %s
          <div class="pie">Esto es un teléfono virtual, no uno físico: sirve para cazar errores de arranque, diseño y navegación antes de entregar la APK. La prueba final — que el aviso llegue de verdad — sigue siendo en el teléfono de un buscador.</div>
          </div></body></html>""" % (ver, ver, ahora, color, color, veredicto, detalle, figs)
          open(os.path.join(out, "index.html"), "w", encoding="utf-8").write(html)
          print("índice generado:", len(caps), "capturas · veredicto", veredicto)
          PYEOF3

      - name: Publicar las capturas en Pages (carpeta ojo-android/)
        if: always()
        run: |
          git config user.name "Ojo Android (Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add ojo-android
          git commit -m "Ojo Android: recorrido Mi Trabajo ${{ steps.apk.outputs.version }}" || echo "sin cambios que publicar"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break || sleep 6
          done

      - name: Subir capturas y registro como artifact de la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ojo-android-${{ steps.apk.outputs.version }}
          path: |
            ojo-android
            logcat.txt
            dump-entrada.xml
            dump-tour.xml
          if-no-files-found: ignore
