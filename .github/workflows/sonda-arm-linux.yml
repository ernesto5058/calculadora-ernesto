name: Sonda ARM Linux (temporal)

# Sonda 2026-11-15: ¿el runner Linux ARM64 de GitHub (ubuntu-24.04-arm)
# expone /dev/kvm? Si sí, el emulador arm64 corre NATIVO ahí y la puerta
# ARM vive en Linux como la x86. Se borra al cerrar el diagnóstico.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    name: KVM en ubuntu-24.04-arm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Revisar KVM y el SDK
        run: |
          echo "arch: $(uname -m)"
          ls -la /dev/kvm || echo "SIN /dev/kvm antes de la regla udev"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || echo "SIN /dev/kvm tras la regla udev"
          test -r /dev/kvm && test -w /dev/kvm && echo "KVM UTILIZABLE" || echo "KVM NO UTILIZABLE"
          ls /usr/local/lib/android/sdk 2>/dev/null || echo "sin SDK preinstalado en /usr/local/lib/android/sdk"
          nproc
