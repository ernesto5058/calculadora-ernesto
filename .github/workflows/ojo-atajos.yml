name: Ojo Atajos — Laboratorio del Máster

# LABORATORIO DE ATAJOS (orden de Ernesto 2026-11-12: «métete adentro»):
# el iPhone de Ernesto deja de ser el probador. Este flujo corre en el MISMO
# runner macOS del Ojo iOS e importa el atajo en la app Atajos del Mac
# anfitrión, lo abre en el editor (fotos), barre sus parámetros ya importado
# (cazando blobs plist en la base local de Atajos, esquema nuevo de macOS 26)
# y corre su espina contra el cerebro real (los latidos se leen después en
# Supabase: maximo_pings / maximo_latidos, ventana marcada en marcas.txt).
# Pieza PRINCIPAL: la referencia fijada del Máster v4.1 en
# atajos/lab/maximo-v41-referencia.shortcut (sha256 cf3740d0…) — la versión
# cuya pancarta «Elige un valor para cada parámetro de la acción» cazó
# Ernesto en su editor (If de enTxt sin operando). Se importa con el nombre
# de archivo maximo.shortcut pa que entre en la app como «maximo», igual
# que en su iPhone. El publicado vivo se descarga en cada corrida y se
# registra su sha; si difiere, también se intenta importar y barrer.
# Lecciones de la corrida 1 (run 43286804132): `open -a Shortcuts` SÍ abre
# la hoja de importación con su botón «Add Shortcut», pero el botón no vive
# en la ruta AX de ventanas/hojas — hay que recorrer el árbol AX entero o
# clicar por coordenadas; la base de macOS 26 ya no trae la tabla ZSHORTCUT;
# en el simulador la app es com.apple.shortcuts (no com.apple.workflow) y
# su import-shortcut por URL rechaza URLs que no sean de iCloud.
# La evidencia vive SOLO en el artefacto (sin push: GH013).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ojo-atajos
  cancel-in-progress: false

jobs:
  lab-atajos:
    name: Importar, validar y correr el Máster en el Mac
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar el laboratorio
        run: |
          set +e
          mkdir -p lab-atajos
          exec > >(tee -a lab-atajos/00-preparacion.log) 2>&1
          echo "== fecha UTC del runner: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sw_vers
          echo "T_INICIO $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee lab-atajos/marcas.txt
          cp atajos/lab/maximo-v41-referencia.shortcut lab-atajos/maximo.shortcut
          curl -sL --max-time 60 "https://ernesto5058.github.io/calculadora-ernesto/atajos/maximo.shortcut" -o lab-atajos/maximo-vivo.shortcut
          echo "-- sha256 de las piezas:"
          shasum -a 256 lab-atajos/maximo.shortcut lab-atajos/maximo-vivo.shortcut
          SHA_V41=$(shasum -a 256 lab-atajos/maximo.shortcut | awk '{print $1}')
          SHA_VIVO=$(shasum -a 256 lab-atajos/maximo-vivo.shortcut | awk '{print $1}')
          echo "SHA_V41=$SHA_V41" >> lab-atajos/marcas.txt
          echo "SHA_VIVO=$SHA_VIVO" >> lab-atajos/marcas.txt
          if [ "$SHA_V41" = "$SHA_VIVO" ]; then echo "VIVO_ES_V41 si" >> lab-atajos/marcas.txt; else echo "VIVO_ES_V41 no" >> lab-atajos/marcas.txt; fi
          echo "== atajos ANTES de tocar nada:"
          shortcuts list 2>&1 | tee lab-atajos/01-lista-antes.txt
          ls -la ~/Library/Shortcuts/

      - name: Importar la referencia v4.1 (clic en «Add Shortcut»)
        continue-on-error: true
        run: |
          set +e
          exec > >(tee -a lab-atajos/02-importacion.log) 2>&1
          vigia(){ # $1 segundos, $2 pid — mata si sigue vivo
            for i in $(seq 1 "$1"); do sleep 1; kill -0 "$2" 2>/dev/null || return 0; done
            kill "$2" 2>/dev/null; echo "(vigia: proceso cortado a los $1 s)"
          }
          echo "== abriendo la pieza en la app Atajos: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          open -a Shortcuts "$GITHUB_WORKSPACE/lab-atajos/maximo.shortcut"
          echo "open salio con codigo $?"
          sleep 12
          screencapture -x lab-atajos/02-hoja-importacion.png 2>&1
          cat > /tmp/clic-ax.scpt <<'EOF'
          tell application "System Events"
            tell process "Shortcuts"
              set frontmost to true
              delay 1
              repeat with w in windows
                set todo to entire contents of w
                repeat with el in todo
                  try
                    if role of el is "AXButton" then
                      set n to name of el
                      if n is not missing value and n contains "Add Shortcut" then
                        click el
                        return "CLIC-AX en boton: " & n
                      end if
                    end if
                  end try
                end repeat
              end repeat
              return "sin boton Add Shortcut en el arbol AX"
            end tell
          end tell
          EOF
          osascript /tmp/clic-ax.scpt > lab-atajos/02-clic.txt 2>&1 & P=$!; vigia 45 $P
          echo "-- clic por arbol AX:"; cat lab-atajos/02-clic.txt
          sleep 4
          if ! shortcuts list 2>/dev/null | grep -qi "maximo"; then
            echo "== la lista aun no lo trae: clic por coordenadas sobre el boton de la foto"
            cat > /tmp/clic-xy.scpt <<'EOF'
          tell application "System Events"
            tell process "Shortcuts" to set frontmost to true
            delay 1
            click at {547, 218}
            return "CLIC-XY en {547, 218}"
          end tell
          EOF
            osascript /tmp/clic-xy.scpt >> lab-atajos/02-clic.txt 2>&1 & P=$!; vigia 30 $P
            cat lab-atajos/02-clic.txt
            sleep 5
          fi
          screencapture -x lab-atajos/02-tras-importar.png 2>&1
          echo "== lista DESPUES del intento de importacion:"
          shortcuts list 2>&1 | tee lab-atajos/02-lista-despues.txt
          shortcuts list 2>/dev/null | grep -i "^maximo$" | head -1 | sed 's/\r//' > lab-atajos/nombre-atajo.txt
          if [ ! -s lab-atajos/nombre-atajo.txt ]; then shortcuts list 2>/dev/null | grep -i "maximo" | head -1 | sed 's/\r//' > lab-atajos/nombre-atajo.txt; fi
          echo "-- nombre detectado:"; cat lab-atajos/nombre-atajo.txt

      - name: Abrir en el editor y fotografiar (caza de la pancarta)
        if: always()
        run: |
          set +e
          exec > >(tee -a lab-atajos/03-editor.log) 2>&1
          NOMBRE=$(head -1 lab-atajos/nombre-atajo.txt)
          if [ -z "$NOMBRE" ]; then echo "SIN NOMBRE: la importacion no dejo el atajo en la lista; el editor no se puede abrir."; exit 0; fi
          echo "== abriendo el editor con: shortcuts view \"$NOMBRE\""
          shortcuts view "$NOMBRE" 2>&1
          echo "view salio con codigo $?"
          sleep 12
          screencapture -x lab-atajos/03-editor-00.png 2>&1
          cat > /tmp/scroll.scpt <<'EOF'
          tell application "System Events"
            tell process "Shortcuts" to set frontmost to true
            delay 1
            key code 121
            delay 1
            key code 121
            delay 1
            key code 121
            return "pagedown x3"
          end tell
          EOF
          for n in 1 2 3 4; do
            ( osascript /tmp/scroll.scpt >> lab-atajos/03-scroll.log 2>&1 & echo $! > /tmp/osa.pid )
            sleep 10; kill $(cat /tmp/osa.pid) 2>/dev/null
            screencapture -x "lab-atajos/03-editor-$n.png" 2>&1
          done
          ls -la lab-atajos/*.png

      - name: Barrido de parámetros (caza de blobs en la base de Atajos)
        if: always()
        run: |
          set +e
          exec > >(tee -a lab-atajos/04-barrido.log) 2>&1
          python3 - <<'PYEOF'
          import sqlite3, os, plistlib
          db = os.path.expanduser("~/Library/Shortcuts/Shortcuts.sqlite")
          print("base principal:", db, os.path.getsize(db) if os.path.exists(db) else "NO EXISTE")
          con = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          cur = con.cursor()
          tablas = [r[0] for r in cur.execute("SELECT name FROM sqlite_master WHERE type='table'")]
          print("tablas:", tablas)
          os.makedirs("lab-atajos/blobs", exist_ok=True)
          hallados = 0
          for t in tablas:
              cols = [(r[1], r[2]) for r in cur.execute(f"PRAGMA table_info({t})")]
              print(f"-- {t}: {cols}")
              for cname, ctype in cols:
                  if "BLOB" not in (ctype or "").upper() and cname.upper() not in ("ZDATA", "DATA"):
                      continue
                  try:
                      filas = cur.execute(f"SELECT rowid, length({cname}), {cname} FROM {t} WHERE {cname} IS NOT NULL AND length({cname}) > 400").fetchall()
                  except Exception as e:
                      print("   consulta fallo:", t, cname, e); continue
                  for rid, largo, blob in filas:
                      try:
                          pl = plistlib.loads(blob)
                      except Exception:
                          continue
                      s = str(pl)[:400]
                      if "workflow" in s.lower() or "WFWorkflow" in s:
                          dest = f"lab-atajos/blobs/{t}-{cname}-{rid}.bplist"
                          open(dest, "wb").write(blob)
                          print("BLOB-PLIST con pinta de atajo:", dest, largo, "bytes")
                          hallados += 1
          print("blobs de atajo hallados:", hallados)
          PYEOF
          ls -la lab-atajos/blobs/ 2>&1
          cp .github/workflows/ojo-atajos.yml lab-atajos/ 2>/dev/null || true
          cat > lab-atajos/barrido.py <<'PYEOF'
          import plistlib, sys, os, json, glob
          def texto_de(v, prof=0):
              if prof > 6: return ""
              if isinstance(v, str): return v
              if isinstance(v, dict):
                  partes = []
                  for k in ("string", "VariableName", "WFTokenString"):
                      if k in v: partes.append(texto_de(v[k], prof + 1))
                  if "Value" in v: partes.append(texto_de(v["Value"], prof + 1))
                  return " ".join(p for p in partes if p)
              return ""
          def acciones_de(pl):
              if isinstance(pl, dict):
                  for k in ("WFWorkflowActions", "actions"):
                      if isinstance(pl.get(k), list): return pl[k]
                  for v in pl.values():
                      r = acciones_de(v)
                      if r: return r
              if isinstance(pl, list) and pl and isinstance(pl[0], dict) and any("WFWorkflowActionIdentifier" in x for x in pl if isinstance(x, dict)):
                  return pl
              return []
          def barrer(ruta):
              print(f"### BARRIDO de {ruta}")
              try:
                  pl = plistlib.loads(open(ruta, "rb").read())
              except Exception as e:
                  print("no parsea:", e); return
              acts = acciones_de(pl)
              print(f"acciones totales: {len(acts)}")
              if not acts: return
              malos = []
              for i, a in enumerate(acts):
                  if not isinstance(a, dict): continue
                  ident = a.get("WFWorkflowActionIdentifier", "")
                  params = a.get("WFWorkflowActionParameters", {}) or {}
                  if ident == "is.workflow.actions.conditional" and params.get("WFControlFlowMode", 0) == 0:
                      entrada = params.get("WFInput")
                      varname = texto_de(params.get("WFInputVariable") or entrada or {})
                      crudo = json.dumps(entrada, default=str) if entrada is not None else "AUSENTE"
                      vacio = entrada is None or texto_de(entrada).strip() == ""
                      print(f"If #{i}: condicion={params.get('WFCondition')} sujeto='{varname[:40]}' operando={crudo[:140]} -> {'OPERANDO VACIO <<<' if vacio else 'ok'}")
                      if vacio: malos.append(i)
                  if "enTxt" in json.dumps(params, default=str):
                      print(f"accion #{i} ({ident}) MENCIONA enTxt: {json.dumps(params, default=str)[:320]}")
              print(f"condicionales con operando vacio: {malos if malos else 'NINGUNO'}")
          rutas = sys.argv[1:]
          if not rutas: print("sin blobs que barrer")
          for r in rutas: barrer(r)
          PYEOF
          python3 lab-atajos/barrido.py lab-atajos/blobs/*.bplist 2>&1 | tee lab-atajos/04-barrido.txt

      - name: Correr la espina contra el cerebro real
        if: always()
        run: |
          set +e
          exec > >(tee -a lab-atajos/05-corrida.log) 2>&1
          NOMBRE=$(head -1 lab-atajos/nombre-atajo.txt)
          if [ -z "$NOMBRE" ]; then echo "SIN NOMBRE: no hay atajo importado que correr."; exit 0; fi
          echo "T0_RUN $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a lab-atajos/marcas.txt
          echo "== corriendo: shortcuts run \"$NOMBRE\" (la ventana T0..T1 se cruza con maximo_pings)"
          shortcuts run "$NOMBRE" > lab-atajos/05-stdout.txt 2> lab-atajos/05-stderr.txt &
          RPID=$!
          for i in $(seq 1 90); do sleep 2; kill -0 $RPID 2>/dev/null || break; done
          if kill -0 $RPID 2>/dev/null; then
            echo "TIMEOUT: la corrida seguia viva a los 180 s; se mata." | tee -a lab-atajos/05-corrida.log
            kill $RPID 2>/dev/null; sleep 2; kill -9 $RPID 2>/dev/null
            echo "timeout-180s" > lab-atajos/05-resultado.txt
          else
            wait $RPID; echo "codigo de salida: $?" | tee lab-atajos/05-resultado.txt
          fi
          echo "T1_RUN $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a lab-atajos/marcas.txt
          echo "-- stdout:"; cat lab-atajos/05-stdout.txt
          echo "-- stderr:"; cat lab-atajos/05-stderr.txt
          screencapture -x lab-atajos/05-tras-correr.png 2>&1

      - name: Simulador iPhone — Atajos por dentro
        if: always()
        run: |
          set +e
          exec > >(tee -a lab-atajos/06-simulador.log) 2>&1
          python3 - <<'PYEOF'
          import json, subprocess, re
          def run(*a):
              return subprocess.run(a, capture_output=True, text=True).stdout
          devs = json.loads(run("xcrun", "simctl", "list", "devices", "available", "--json"))
          mejor = None
          for runtime, lista in devs.get("devices", {}).items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m: continue
              ver = (int(m.group(1)), int(m.group(2)))
              for d in lista:
                  if "iPhone" in d.get("name", "") and d.get("isAvailable", True):
                      if mejor is None or ver > mejor[0]: mejor = (ver, runtime, d)
          if mejor is None:
              print("SIN IPHONE SIMULADO"); raise SystemExit(0)
          ver, runtime, d = mejor
          open("lab-atajos/sim-udid.txt", "w").write(d["udid"])
          print("simulador:", d["name"], "· iOS", f"{ver[0]}.{ver[1]}", "·", d["udid"])
          PYEOF
          UDID=$(cat lab-atajos/sim-udid.txt 2>/dev/null)
          if [ -z "$UDID" ]; then echo "sin UDID; se salta el simulador."; exit 0; fi
          xcrun simctl boot "$UDID" 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b 2>&1 | tail -2
          echo "== la app Atajos en el simulador (listapps):"
          xcrun simctl listapps "$UDID" 2>/dev/null | grep -A3 '"com.apple.shortcuts"' | tee lab-atajos/06-apps.txt
          echo "== lanzar Atajos con su identificador de iOS 26 (com.apple.shortcuts):"
          xcrun simctl launch "$UDID" com.apple.shortcuts 2>&1 | tee lab-atajos/06-launch.txt
          sleep 6
          xcrun simctl io "$UDID" screenshot lab-atajos/06-sim-atajos.png 2>&1
          echo "== importar por URL (import-shortcut, URL de Pages — la app ya dijo en la corrida 1 que la rechaza por no ser de iCloud; se repite pa el registro):"
          xcrun simctl openurl "$UDID" "shortcuts://import-shortcut?url=https%3A%2F%2Fernesto5058.github.io%2Fcalculadora-ernesto%2Fatajos%2Fmaximo.shortcut&name=maximo" 2>&1 | tee lab-atajos/06-import-url.txt
          sleep 6
          xcrun simctl io "$UDID" screenshot lab-atajos/06-sim-import.png 2>&1
          ls -la lab-atajos/*.png

      - name: Resumen del laboratorio
        if: always()
        run: |
          set +e
          python3 - <<'PYEOF'
          import os
          L = "lab-atajos"
          def leer(p, d=""):
              try: return open(os.path.join(L, p), encoding="utf-8", errors="replace").read()
              except Exception: return d
          def tiene(p): return os.path.exists(os.path.join(L, p))
          marcas = leer("marcas.txt")
          despues = leer("02-lista-despues.txt")
          imp = "SI (maximo aparece en shortcuts list)" if any(l.strip().lower() == "maximo" for l in despues.splitlines()) else "NO"
          barrido = leer("04-barrido.txt")
          if "OPERANDO VACIO" in barrido: bver = "REPRODUCE el parametro vacio (ver 04-barrido.txt)"
          elif "NINGUNO" in barrido: bver = "barrido hecho: ningun condicional sin operando"
          elif barrido.strip(): bver = "barrido parcial (ver 04-barrido.txt)"
          else: bver = "SIN barrido"
          corrida = leer("05-resultado.txt", "sin resultado").strip()
          stderr = leer("05-stderr.txt").strip().splitlines()
          sim = leer("06-apps.txt").strip().splitlines()
          fotos = sorted(f for f in os.listdir(L) if f.endswith(".png"))
          out = []
          out.append("RESUMEN DEL LABORATORIO DE ATAJOS")
          out.append(marcas.strip())
          out.append(f"IMPORTACION en la app Atajos del Mac: {imp}")
          out.append(f"BARRIDO de parametros: {bver}")
          out.append(f"CORRIDA de la espina (shortcuts run): {corrida}")
          if stderr: out.append("stderr de la corrida: " + " | ".join(stderr[:4]))
          out.append(f"SIMULADOR — Atajos presente: {'si (com.apple.shortcuts)' if sim else 'no confirmado'}")
          out.append(f"FOTOS de evidencia: {', '.join(fotos) if fotos else 'ninguna'}")
          open(os.path.join(L, "resumen.txt"), "w", encoding="utf-8").write("\n".join(out) + "\n")
          print("\n".join(out))
          PYEOF

      - name: Subir la evidencia como artefacto de la corrida
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-atajos
          path: lab-atajos
          if-no-files-found: warn
