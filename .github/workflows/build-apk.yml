name: Construir APK Mi Trabajo

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nombre de versión visible (ej: 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Código de versión (SIEMPRE mayor que el anterior)"
        required: true
        default: "10000"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Resolver versión (en push usa 1.0.0 y 10000)
        id: ver
        run: |
          echo "version_name=${{ inputs.version_name || github.event.client_payload.version_name || '1.0.0' }}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ inputs.version_code || github.event.client_payload.version_code || '10000' }}" >> "$GITHUB_OUTPUT"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias
        run: npm ci --no-fund --no-audit

      - name: Ensamblar el index de la app (si las fuentes divididas ya están)
        run: |
          if [ -f buscadores-app/ensamblar.py ]; then python3 buscadores-app/ensamblar.py; fi

      - name: Sincronizar la app web dentro del proyecto Android
        run: npx cap sync android

      - name: Escribir la versión
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.version_name }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Restaurar la llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keys/mitrabajo.keystore"
          cat > android/keystore.properties <<EOF2
          storeFile=$RUNNER_TEMP/keys/mitrabajo.keystore
          storePassword=$STORE_PASS
          keyAlias=mitrabajo
          keyPassword=$STORE_PASS
          EOF2

      - name: Compilar y firmar el APK (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Preparar la entrega
        id: prep
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC"
          cp "$SRC" "Mi-Trabajo-v${{ steps.ver.outputs.version_name }}.apk"
          sha256sum "Mi-Trabajo-v${{ steps.ver.outputs.version_name }}.apk" | tee sha256.txt
          echo "apk=Mi-Trabajo-v${{ steps.ver.outputs.version_name }}.apk" >> "$GITHUB_OUTPUT"

      - name: Publicar la Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "apk-v${{ steps.ver.outputs.version_name }}"
          name: "Mi Trabajo v${{ steps.ver.outputs.version_name }} (APK)"
          body: |
            App Android «Mi Trabajo» para los buscadores — APK firmado, instalable directo.
            SHA-256 en sha256.txt adjunto.
          files: |
            ${{ steps.prep.outputs.apk }}
            sha256.txt
