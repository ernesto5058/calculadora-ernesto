# =====================================================================
# promptfoo-agente.yml — INSTALADO el 2026-11-12 por Máximo (aplicación
# del programa Dominio Total). Copia del workflow preparado en
# promptfoo/ci/promptfoo-agente.yml con UN cambio deliberado: corre en
# modo NO BLOQUEANTE (continue-on-error en el job y la puerta final
# solo reporta) porque el dataset trae un caso en rojo conocido y
# honesto — PF-25 (hallazgo H-PF1: el cerebro puede confirmar una cita
# de palabra en texto libre; su cura vive en otra tanda). Cuando PF-25
# pase a verde, endurecer a puerta dura es quitar el continue-on-error.
#
# Qué hace: en cada push/PR que toque la lógica del agente, su dataset
# o su banco eterno, corre la batería dorada completa y deja los
# resultados como artefacto — la batería corre sola en el flujo de
# cada tanda, sin que nadie tenga que acordarse.
# =====================================================================
name: Promptfoo · Agente (batería dorada)

on:
  push:
    paths:
      - "supabase/functions/agente-responder/**"
      - "promptfoo/**"
      - "bancos/prueba-agente-v1.mjs"
  pull_request:
    paths:
      - "supabase/functions/agente-responder/**"
      - "promptfoo/**"
      - "bancos/prueba-agente-v1.mjs"
  workflow_dispatch:

jobs:
  promptfoo-agente:
    name: Promptfoo · Agente (no bloqueante)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: promptfoo/package-lock.json

      - name: Instalar promptfoo (versión fijada del proyecto)
        working-directory: promptfoo
        run: npm ci --no-audit --no-fund

      - name: Correr la batería dorada del agente
        working-directory: promptfoo
        env:
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: npx promptfoo eval -c promptfooconfig.yaml --no-cache -o results/resultados.json

      - name: Resultado de la batería (no bloqueante — solo reporta)
        if: always()
        working-directory: promptfoo
        run: |
          FAILURES=$(jq '.results.stats.failures' results/resultados.json)
          echo "Casos en rojo: $FAILURES"
          if [ "$FAILURES" -gt 0 ]; then
            echo "⚠️ Batería del agente con casos en rojo (esperado hoy: PF-25 / H-PF1): revisa el artefacto resultados-promptfoo-agente"
          else
            echo "✅ Batería del agente en verde"
          fi

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-promptfoo-agente
          path: promptfoo/results/resultados.json
