name: Ojo Maximo (APK)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ojo-movil/**'
      - '.github/workflows/ojo-movil.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK debug
        working-directory: ojo-movil
        run: gradle --no-daemon assembleDebug

      - name: Badging del APK
        run: |
          AAPT=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$AAPT" dump badging ojo-movil/app/build/outputs/apk/debug/app-debug.apk | head -5

      - name: Subir el APK
        uses: actions/upload-artifact@v7
        with:
          name: OjoMaximo-v1-apk
          path: ojo-movil/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
