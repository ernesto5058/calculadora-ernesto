name: Lighthouse CI (presupuestos)

# FUSIÓN 2026-11-12 (un solo job, una sola verdad): el workflow suave del
# Inspector v2 + los presupuestos duros del programa Dominio Total
# (líneas base medidas 2026-11-12: minegocio 91 · mercado 61 ·
# negocio 92 · buscadores 79). La config vive en lighthouserc.json
# (raíz): 3 corridas por URL, assertMatrix por página, `error` SOLO en
# métricas deterministas (categorías estables, resource-summary en
# bytes/conteos, CLS estable) y `warn` en performance y tiempos
# (varianza medida de hasta 43 puntos entre corridas idénticas).
# La puerta muerde porque NO hay continue-on-error ni `|| true`:
# si `lhci assert` devuelve una aserción en error, el job cae.

on:
  workflow_dispatch:
  schedule:
    # Semanal: lunes 07:17 UTC
    - cron: '17 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'minegocio/**'
      - 'mercado/**'
      - 'negocio/**'
      - 'buscadores/**'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'
  pull_request:
    paths:
      - 'minegocio/**'
      - 'mercado/**'
      - 'negocio/**'
      - 'buscadores/**'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lighthouse:
    name: Lighthouse (presupuestos)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Lighthouse CI
        run: npm install -g @lhci/cli@0.15.1

      - name: Correr Lighthouse CI (collect + assert + upload)
        run: lhci autorun

      - name: Guardar informes como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci-reports
          path: .lighthouseci
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
