name: Ojo Web · Mi Trabajo (interior)

# RECORRIDO INTERIOR DE MI TRABAJO POR EL OJO WEB (2026-11-11, cierre del
# hueco del Ojo Android): el emulador Android quedó PARCIAL por su propio
# árbol de accesibilidad corrupto (Reportar/Mi panel fuera de pantalla pa
# el robot; la app no se cayó en 12 corridas). Este arnés recorre la
# versión WEB de Mi Trabajo con Chromium (que sí pinta bien) entrando con
# la cuenta de prueba PEUEBA — llave permanente del Ojo, sin datos de
# Briku/Abraham — y fotografía las pantallas, el editor de foto del chat
# ABIERTO (sin enviar: se descarta con la ✕) y el botón «Editar» de
# reportes. Ese botón solo nace con un reporte pendiente en el buzón
# LOCAL: se siembra uno solo en el localStorage de este navegador de
# mentira con la red de Supabase bloqueada ANTES de sembrar — el
# despachador de la app no puede sacarlo y el contexto muere al cerrar.
# Álbum propio en ojo-web/mitrabajo-web/ sin pisar el bautizo de Mercado.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ojo-web-mitrabajo
  cancel-in-progress: false

jobs:
  ojo-web-mitrabajo:
    name: Recorrido interior de Mi Trabajo (web) con PEUEBA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Playwright y Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.49.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Recorrer Mi Trabajo por dentro
        run: |
          mkdir -p ojo-web/mitrabajo-web/capturas
          cat > ojo-web/mitrabajo-web/fotos.mjs <<'JSEOF'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs';

          const DIR = 'ojo-web/mitrabajo-web';
          const URL_APP = 'https://ernesto5058.github.io/calculadora-ernesto/buscadores/?codigo=PEUEBA';
          const R = { entrada: false, pantallas: [], editor: false, editar: false, editarModo: false, notas: [] };
          const man = [];
          function nota(s) { R.notas.push(s); console.log('NOTA:', s); }

          const browser = await chromium.launch();
          const ctx = await browser.newContext({ ...devices['Pixel 7'] });
          const page = await ctx.newPage();
          async function foto(archivo, pie) {
            await page.screenshot({ path: DIR + '/capturas/' + archivo });
            man.push(archivo + '|' + pie);
          }
          // Toque robusto: click normal de Playwright y, si un elemento
          // flotante lo intercepta (v1: los 3 primeros toques morían así),
          // click DOM directo — las pestañas escuchan click de verdad.
          async function tocar(sel) {
            try { await page.click(sel, { timeout: 3500 }); return 'normal'; }
            catch (e) {
              const ok = await page.evaluate((s) => {
                const el = document.querySelector(s);
                if (!el) return false;
                el.click();
                return true;
              }, sel);
              if (!ok) throw new Error('sin elemento ' + sel);
              return 'dom';
            }
          }
          async function vistaVisible(id) {
            return await page.evaluate((v) => {
              const el = document.getElementById(v);
              return !!el && !el.classList.contains('hide') && el.getBoundingClientRect().height > 0;
            }, id);
          }
          try {
            await page.goto(URL_APP, { waitUntil: 'domcontentloaded', timeout: 60000 });
            try {
              await page.waitForFunction(() => {
                const g = document.getElementById('loginGate');
                return document.body && !document.body.classList.contains('locked') && g && g.classList.contains('hide');
              }, { timeout: 45000 });
              R.entrada = true;
            } catch (e) { nota('La puerta no abrió con ?codigo=PEUEBA en 45 s.'); }
            await page.waitForTimeout(5000);
            // Si la app muestra su tarjeta de avisos tras entrar, se aparta
            // por la vía suave («Ahora no» / «Después») y queda anotado.
            const tarjeta = await page.evaluate(() => {
              const bs = [...document.querySelectorAll('button, a')];
              const b = bs.find(x => {
                const r = x.getBoundingClientRect();
                return r.height > 0 && /ahora no|después|no, gracias/i.test(x.textContent || '');
              });
              if (b) { b.click(); return (b.textContent || '').trim(); }
              return '';
            });
            if (tarjeta) { nota('Tarjeta flotante apartada tras entrar: «' + tarjeta + '».'); await page.waitForTimeout(800); }
            if (R.entrada) await foto('00-entrada.png', 'Mi Trabajo — así queda la app al entrar con PEUEBA (la pantalla que abre).');

            if (R.entrada) {
              const tabs = [
                ['#tabCalc', 'viewCalc', 'Calculadora', '01-calculadora.png', 'Mi Trabajo · Calculadora — la pantalla que abre al entrar (cuenta PEUEBA).'],
                ['#tabRep', 'viewRep', 'Reportar', '02-reportar.png', 'Mi Trabajo · Reportar — el formulario de tratos y su lista, que en PEUEBA nace vacía.'],
                ['#tabPanel', 'viewPanel', 'Mi panel', '03-mi-panel.png', 'Mi Trabajo · Mi panel — la semana del buscador (tratos, total y bono) de PEUEBA.'],
                ['#tabAyuda', 'viewAyuda', 'Chat', '04-chat.png', 'Mi Trabajo · Chat — la conversación con Ernesto de la cuenta de prueba.'],
                ['#tabTextos', 'viewTextos', 'Textos', '05-textos.png', 'Mi Trabajo · Textos — los anuncios listos pa copiar.'],
                ['#tabPerfil', 'viewPerfil', 'Mi perfil', '06-mi-perfil.png', 'Mi Trabajo · Mi perfil — nombre, color y avisos de PEUEBA.'],
              ];
              for (const [sel, vista, nombre, archivo, pie] of tabs) {
                try {
                  const via = await tocar(sel);
                  await page.waitForTimeout(2200);
                  if (!(await vistaVisible(vista))) { nota(nombre + ': la vista no quedó visible tras el toque (' + via + ').'); continue; }
                  if (via === 'dom') nota(nombre + ': el toque normal fue interceptado; entró el toque DOM.');
                  await page.evaluate(() => window.scrollTo(0, 0));
                  await page.waitForTimeout(400);
                  await foto(archivo, pie);
                  R.pantallas.push(nombre);
                } catch (e) { nota('No se pudo fotografiar ' + nombre + ': ' + String(e).slice(0, 120)); }
              }

              // Editor de foto del chat (sin enviar): elegir la foto lo abre.
              try {
                await tocar('#tabAyuda');
                await page.waitForTimeout(1800);
                await page.setInputFiles('#c_file_foto', 'buscadores/icon-512.png');
                await page.waitForSelector('#editorFoto.abierto', { timeout: 10000 });
                await page.waitForTimeout(900);
                await page.fill('#edFotoTxtMT', 'Foto de prueba del Ojo — no se envía');
                await page.waitForTimeout(500);
                await foto('07-chat-editor-foto.png', 'Mi Trabajo · Chat — el editor de foto a pantalla completa (paso WhatsApp): foto elegida y pie escrito. NO se envió nada: se descartó con la ✕.');
                R.editor = true;
                await tocar('#edFotoXMT');
                await page.waitForFunction(() => {
                  const v = document.getElementById('editorFoto');
                  return !v || !v.classList.contains('abierto');
                }, { timeout: 6000 }).catch(() => nota('El editor no confirmó su cierre tras la ✕.'));
                await page.waitForTimeout(500);
              } catch (e) { nota('Editor de foto no alcanzado: ' + String(e).slice(0, 160)); }

              // Botón «Editar»: nace solo con un reporte pendiente en el
              // buzón LOCAL. Se siembra SOLO en este navegador, con la red
              // de Supabase bloqueada desde antes: no puede salir.
              try {
                await page.route('**://*.supabase.co/**', r => r.abort());
                await page.evaluate(() => {
                  const rp = { id: '11111111-2222-4333-8444-555555555555', tipo: 'saldo', precio: 950,
                    cantidad: 2, telefono: '51231558', nota: 'Reporte de prueba del Ojo (local, nunca enviado)',
                    fecha: new Date().toLocaleString('es-ES'), estado: 'pendiente', enviado: false };
                  localStorage.setItem('busc_outbox', JSON.stringify([rp]));
                  if (typeof renderOutbox === 'function') renderOutbox();
                });
                await tocar('#tabRep');
                await page.waitForTimeout(1500);
                const hayBoton = await page.evaluate(() => !!document.querySelector('[data-edrep]'));
                if (hayBoton) {
                  R.editar = true;
                  await page.evaluate(() => { const l = document.querySelector('#r_lista'); if (l) l.scrollIntoView(); });
                  await page.waitForTimeout(500);
                  await foto('08-reportar-con-editar.png', 'Mi Trabajo · Reportar — la lista con un reporte pendiente y su botón «Editar» (sembrado SOLO en este navegador, con la red bloqueada: nunca salió).');
                  await tocar('[data-edrep]');
                  await page.waitForTimeout(1200);
                  await page.evaluate(() => window.scrollTo(0, 0));
                  await page.waitForTimeout(400);
                  const modo = await page.evaluate(() => {
                    const b = document.getElementById('r_btn');
                    return b ? b.textContent.trim() : '';
                  });
                  if (modo.includes('Guardar la corrección')) R.editarModo = true;
                  await foto('09-reportar-editando.png', 'Mi Trabajo · Reportar — tras tocar «Editar»: el formulario entra en modo corrección con los datos del reporte cargados.');
                } else {
                  nota('El botón «Editar» no apareció ni con el reporte local sembrado.');
                }
              } catch (e) { nota('Editar no alcanzado: ' + String(e).slice(0, 160)); }
            } else {
              await foto('00-puerta.png', 'Mi Trabajo — la puerta: en esta corrida el recorrido no pudo entrar con PEUEBA.');
            }
          } catch (e) { nota('Fallo general: ' + String(e).slice(0, 200)); }
          await browser.close();
          fs.writeFileSync(DIR + '/resultados.json', JSON.stringify(R, null, 2));
          man.sort();
          fs.writeFileSync(DIR + '/capturas.txt', man.join('\n') + '\n');
          console.log(JSON.stringify(R, null, 2));
          JSEOF
          node ojo-web/mitrabajo-web/fotos.mjs

      - name: Generar el índice del álbum (Pages)
        if: always()
        run: |
          python3 - <<'PYEOF'
          import os, json, datetime
          out = "ojo-web/mitrabajo-web"
          os.makedirs(out + "/capturas", exist_ok=True)
          def leer(p, defecto=""):
              try: return open(os.path.join(out, p), encoding="utf-8").read().strip()
              except Exception: return defecto
          try: R = json.loads(leer("resultados.json", "{}"))
          except Exception: R = {}
          caps = []
          for linea in leer("capturas.txt").splitlines():
              if "|" in linea:
                  f, c = linea.split("|", 1)
                  if os.path.exists(os.path.join(out, "capturas", f)): caps.append((f, c))
          pant = R.get("pantallas") or []
          partes = []
          partes.append("Entrada con PEUEBA: " + ("sí, por su enlace" if R.get("entrada") else "NO se logró"))
          if pant: partes.append("Pantallas fotografiadas: " + ", ".join(pant))
          partes.append("Editor de foto del chat abierto y fotografiado (sin enviar): " + ("sí" if R.get("editor") else "no"))
          partes.append("Botón «Editar» de reportes alcanzado: " + ("sí, y el formulario entró en modo corrección" if R.get("editarModo") else ("sí" if R.get("editar") else "no")))
          for n in (R.get("notas") or []): partes.append("Nota: " + n)
          detalle = " · ".join(partes) + "."
          if R.get("entrada") and len(pant) >= 5 and R.get("editor") and R.get("editarModo"): veredicto = "VERDE"
          elif R.get("entrada") and len(pant) >= 4: veredicto = "PARCIAL"
          else: veredicto = "ROJO"
          try:
              from zoneinfo import ZoneInfo
              ahora = datetime.datetime.now(ZoneInfo("America/Havana")).strftime("%d-%m-%Y · %I:%M %p")
          except Exception:
              ahora = datetime.datetime.utcnow().strftime("%d-%m-%Y · %H:%M UTC")
          color = {"VERDE": "#3FB96B", "PARCIAL": "#E8B84B", "ROJO": "#E5534B"}.get(veredicto, "#9AA4B2")
          figs = "\n".join('<figure><img src="capturas/%s" alt="%s" loading="lazy"><figcaption>%s</figcaption></figure>' % (f, c, c) for f, c in caps)
          html = """<!DOCTYPE html>
          <html lang="es"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Ojo Web · Mi Trabajo por dentro</title>
          <style>
            :root{--bg:#0B0E13;--card:#12161F;--borde:#232B3A;--txt:#EDF1F7;--mut:#9AA4B2;--oro1:#F5D67B;--oro2:#E8B84B;--oro3:#C9962E}
            *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
            .envoltura{max-width:560px;margin:0 auto;padding:20px 16px 48px}
            h1{font-size:24px;margin:0 0 4px} h1 .oro{background:linear-gradient(120deg,var(--oro1),var(--oro2),var(--oro3));-webkit-background-clip:text;background-clip:text;color:transparent}
            .mut{color:var(--mut);font-size:14px;line-height:1.45}
            .sello{display:inline-block;margin:14px 0 6px;padding:6px 14px;border-radius:999px;font-weight:700;letter-spacing:.04em;border:1px solid %s;color:%s}
            figure{margin:22px 0;background:var(--card);border:1px solid var(--borde);border-radius:16px;overflow:hidden}
            figure img{width:100%%;display:block}
            figcaption{padding:12px 14px;font-size:14px;color:var(--mut);line-height:1.45}
            .pie{margin-top:28px;font-size:13px;color:var(--mut);line-height:1.5}
          </style></head><body><div class="envoltura">
          <h1>Ojo Web · <span class="oro">Mi Trabajo por dentro</span></h1>
          <div class="mut">Recorrido interior de la versión web de Mi Trabajo con la cuenta de prueba PEUEBA, a tamaño de teléfono. %s (hora de Cuba).</div>
          <div class="sello">%s</div>
          <div class="mut">%s</div>
          %s
          <div class="pie">Alcance honesto: la cuenta es la de prueba del Ojo (PEUEBA), sin datos de Briku ni Abraham. El editor de foto se fotografió SIN enviar (se descartó). El reporte con «Editar» se sembró solo en el navegador del robot, con la red de Supabase bloqueada: nunca salió de ahí. Esto es un navegador de mentira en un servidor: caza errores de carga y de diseño; la prueba final sigue siendo el teléfono de verdad.</div>
          </div></body></html>""" % (ahora, color, color, veredicto, detalle, figs)
          open(os.path.join(out, "index.html"), "w", encoding="utf-8").write(html)
          open(os.path.join(out, "veredicto.txt"), "w", encoding="utf-8").write(veredicto + "\n")
          open(os.path.join(out, "detalle.txt"), "w", encoding="utf-8").write(detalle + "\n")
          print("índice generado:", len(caps), "capturas · veredicto", veredicto)
          PYEOF

      - name: Publicar el álbum en Pages (ojo-web/mitrabajo-web/)
        if: always()
        run: |
          git checkout -- package.json package-lock.json 2>/dev/null || true
          git config user.name "Ojo Web (Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add ojo-web/mitrabajo-web
          git commit -m "Ojo Web · Mi Trabajo: recorrido interior con PEUEBA" || echo "sin cambios que publicar"
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
            echo "Reintento $i: otro push gano la carrera; rebaseando de nuevo."
            sleep 6
          done
          if [ "$ok" != "1" ]; then echo "No se pudo publicar el album tras 4 intentos."; exit 1; fi

      - name: Subir el álbum como artifact de la corrida
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ojo-web-mitrabajo
          path: ojo-web/mitrabajo-web
          if-no-files-found: ignore
