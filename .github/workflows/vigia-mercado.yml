name: Vigia de mercado (foto horaria)

on:

  push:
    branches: [main]
    paths: [".apk-trigger"]
  schedule:
    - cron: "7 * * * *"
    # Segundo latido: GitHub entrega los schedule con huecos de 4-8 h
    # (medido el 2026-11-12); este pase extra a :37 cada 2 h sube la
    # cadencia real sin costo (repo público, minutos gratis).
    - cron: "37 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tomar la foto del mercado
        run: python3 scripts/foto_mercado.py
      - name: Disparar la construccion del APK si hay orden
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f orden-build.json ]; then
            node scripts/dispatch-build.mjs && rm orden-build.json
          fi
      - name: Guardar la foto en el repo
        run: |
          git config user.name "vigia-mercado"
          git config user.email "vigia@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Foto del mercado $(date -u +%Y-%m-%dT%H:%MZ)"
            ok=0
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
              echo "Reintento $i: otro push gano la carrera; rebaseando de nuevo."
              sleep 6
            done
            if [ "$ok" != "1" ]; then echo "No se pudo guardar la foto tras 4 intentos."; exit 1; fi
          fi
