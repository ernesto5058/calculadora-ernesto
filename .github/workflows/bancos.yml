name: Bancos automáticos

# Plan PRO (aprobado por Ernesto 2026-11-11): cada cambio en las apps se
# prueba solo en la nube. Las suites viven en bancos/ (copias de los bancos
# vivos de research_notes con las rutas adaptadas) y el registro de por qué
# existe cada chequeo está en CHEQUEOS-ETERNOS.md.

on:
  push:
    branches: [main]
    paths:
      - 'minegocio/**'
      - 'buscadores/**'
      - 'buscadores-app/**'
      - 'mercado/**'
      - 'shared/**'
      - 'datos/**'
      - 'supabase/functions/**'
      - 'bancos/**'
      - '.github/workflows/bancos.yml'
  # Puerta de main (TOP 4 del estudio de huecos, 2026-11-12): el ruleset de
  # main exige el check «Bancos de las apps» en verde pa fusionar un PR;
  # sin este disparador el check nunca nace en los PRs y la puerta sería
  # un candado sin llave. Mismos caminos que el push.
  pull_request:
    branches: [main]
    paths:
      - 'minegocio/**'
      - 'buscadores/**'
      - 'buscadores-app/**'
      - 'mercado/**'
      - 'shared/**'
      - 'datos/**'
      - 'supabase/functions/**'
      - 'bancos/**'
      - '.github/workflows/bancos.yml'
  workflow_dispatch:

# Plataforma (Dominio Total, 2026-11-12): permisos mínimos — los bancos
# solo leen el repo; no empujan ni publican nada.
permissions:
  contents: read

# Concurrencia (Dominio Total, 2026-11-12): es CI de validación — si llega
# un push nuevo a la misma ref, la corrida vieja ya no aporta nada y se
# cancela; manda siempre la más reciente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bancos:
    name: Bancos de las apps
    runs-on: ubuntu-latest
    # Duración real medida por API (2026-11-12): ~2 min por corrida.
    # Techo de 10 min contra el default de 360: una corrida colgada muere sola.
    timeout-minutes: 10
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Node 24 (el mismo de los bancos locales)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Caché npm de la plataforma: la llave sale del lockfile de bancos/
          # (publicado el 2026-11-12; sin él setup-node no puede cachear).
          cache: 'npm'
          cache-dependency-path: bancos/package-lock.json

      - name: Instalar jsdom (única dependencia de los bancos)
        working-directory: bancos
        # npm ci: instalación exacta y reproducible desde el lockfile
        # (antes npm install resolvía versiones en cada corrida).
        run: npm ci --no-audit --no-fund

      - name: Banco Mi Negocio (223 chequeos)
        run: node bancos/test-minegocio-banco.mjs

      - name: Banco Tarifa Viva — cálculo del servidor y puertas (fila 72)
        run: node bancos/prueba-tarifa-viva-calculo.mjs

      - name: Banco Tarifa Viva — Mi Negocio v20 (semáforo, propuesta, simulador, foto del cierre)
        run: node bancos/prueba-tarifa-viva-minegocio.mjs

      - name: Banco Mi Trabajo v1.6.0 — tarifa viva del buscador (fila 72)
        run: node bancos/prueba-mitrabajo-v160.mjs

      - name: Banco Mi Trabajo — contrato de puertas RPC sin sobrecargas
        run: node bancos/prueba-mitrabajo-v144.mjs

      - name: Banco Mi Trabajo v1.4.5 — textos, monedas y App Links
        run: node bancos/prueba-mitrabajo-v145.mjs

      - name: Banco Mi Trabajo v1.4.6 — Firebase y guía del trabajador
        run: node bancos/prueba-mitrabajo-v146.mjs
      - name: Banco Mi Trabajo v1.4.7 — chat duro (tanda 3 errores)
        run: node bancos/prueba-mitrabajo-v147.mjs

      - name: Banco Mi Trabajo v1.5.3 — Tanda Nº6 Inspector (escape total, colas, pausa, tarifa RESPALDO, chat ligero)
        run: node bancos/prueba-mitrabajo-v153.mjs

      - name: Banco Mi Trabajo v1.5.4 — Sentry de la casa cableado (fila 40)
        run: node bancos/prueba-mitrabajo-v154.mjs

      - name: Banco sin códigos públicos — login solo por servidor (fila 38)
        run: node bancos/prueba-sin-codigos-publicos.mjs

      - name: Banco puertas sin gemelas — foto+texto en ambas apps (fila 17)
        run: node bancos/prueba-puertas-sin-gemelas.mjs

      - name: Banco barra inferior — la .tabbar de Mi Trabajo sin el translateX heredado (fila 21)
        run: node bancos/prueba-barra-inferior.mjs

      - name: Banco FOCO-CHAT — la sonda de foco del compositor y Textos con modo (fila 22)
        run: node bancos/prueba-foco-chat.mjs

      - name: Banco Mercado v2 — lector, Analista INV-A y render (139 chequeos)
        run: node bancos/prueba-mercado-v2.mjs

      - name: Banco Vigía de Ivan — ofertas nombradas y eventos en dos fotos (fila 51)
        run: node bancos/prueba-vigia-ivan.mjs

      - name: Banco puerta de acción — barandas del Nivel 1 (43 chequeos)
        run: node bancos/prueba-actuar-v1.mjs

      - name: Banco Bot PRO — Telegram (46 chequeos)
        run: node bancos/test-telegram-pro-banco.mjs

      - name: Banco Invariantes de dinero INV-1…INV-9 (46 chequeos + H-4 vigilado)
        run: node bancos/test-invariantes-dinero.mjs

      - name: Banco Agente Propio v1 — matcher, grounding, citas y aprendizaje (66 chequeos)
        run: node bancos/prueba-agente-v1.mjs

      - name: Banco Sentry de la casa — escrubado y no-op sin DSN (fila 40)
        run: node sentry-staging/prueba-sentry-casa.mjs

      - name: Banco puerta de avisos — fail-closed 503/401/pasa (fila 53)
        run: node bancos/prueba-avisos-puerta.mjs
