name: CodeQL — análisis de seguridad

# Inspector v2 · Capa 0a: análisis estático de seguridad con CodeQL.
# Busca vulnerabilidades y errores de seguridad en el JavaScript/TypeScript
# del repo (apps, bancos y funciones) en cada push/PR a main y una vez
# por semana aunque no haya cambios.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Semanal: lunes temprano UTC (03:17 UTC)
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Permisos mínimos: leer el código y subir los resultados de seguridad.
permissions:
  contents: read
  security-events: write
  actions: read

# Concurrencia propia: no se cancela una corrida en curso (los resultados
# de seguridad deben completarse).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analizar:
    name: Analizar (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Construcción automática
        uses: github/codeql-action/autobuild@v3

      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v3
