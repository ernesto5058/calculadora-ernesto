<!DOCTYPE html>

<style>
  /* «Mercado» — estilos propios SOLO con tokens de tema-pro.css
     (cero hex sueltos: regla §9.1 del DISENO-PRO). */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg-0); color: var(--txt-1); font: var(--t-cuerpo);
    -webkit-font-smoothing: antialiased; min-height: 100dvh;
  }
  .envoltura { max-width: 560px; margin: 0 auto; padding: 0 var(--e-4); }
  .cab-app {
    position: sticky; top: 0; z-index: 20;
    background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.5);
    backdrop-filter: blur(20px) saturate(1.5);
    border-bottom: 1px solid var(--glass-borde);
  }
  .cab-fila {
    display: flex; align-items: center; gap: var(--e-3);
    padding: var(--e-3) var(--e-4); max-width: 560px; margin: 0 auto;
  }
  .cab-titulo { font: var(--t-seccion); letter-spacing: -0.01em; }
  .cab-sello { margin-left: auto; text-align: right; font: var(--t-nota); color: var(--txt-3); }
  .btn-refrescar {
    width: 44px; height: 44px; border-radius: 999px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-2); border: 1px solid var(--borde-fuerte);
    color: var(--dorado); cursor: pointer;
  }
  .btn-refrescar:active { transform: scale(0.97); }
  .btn-refrescar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .btn-refrescar.girando svg { animation: gira 0.9s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  main { padding: var(--e-4) 0 calc(96px + env(safe-area-inset-bottom)); }
  .pantalla { display: none; }
  .pantalla.activa { display: block; animation: entra var(--anim) both; }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .explica { font: var(--t-sub); color: var(--txt-2); margin: 0 0 var(--e-3); }
  .heroe-num { font: var(--t-display); font-family: var(--fuente-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .heroe-num .unidad { font: var(--t-sub); color: var(--txt-2); font-family: var(--fuente); }
  .rejilla2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e-3); }
  .dato { background: var(--bg-2); border: 1px solid var(--borde); border-radius: var(--r-md); padding: var(--e-3); }
  .dato .etiqueta { margin-bottom: var(--e-1); }
  .dato .valor { font: 600 20px/1.2 var(--fuente-num); font-variant-numeric: tabular-nums; }
  .dato .valor .unidad { font: var(--t-nota); color: var(--txt-2); font-family: var(--fuente); }
  .dato .nota { font: var(--t-nota); color: var(--txt-3); margin-top: var(--e-1); }
  .seccion-tit { font: var(--t-seccion); margin: var(--e-5) 0 var(--e-3); }
  .sello {
    display: inline-flex; align-items: center; gap: var(--e-2);
    padding: var(--e-1) var(--e-3); border-radius: 999px;
    font: var(--t-micro); letter-spacing: 0.04em; text-transform: uppercase;
  }
  .sello .punto { width: 8px; height: 8px; border-radius: 999px; background: currentColor; flex: none; }
  .sello.fresca { background: var(--verde-suave); color: var(--verde); }
  .sello.vieja { background: var(--rojo-suave); color: var(--rojo); }
  .sello.respaldo { background: var(--ambar-suave); color: var(--ambar); }
  .sello.neutro { background: var(--bg-2); color: var(--txt-2); }
  .barra { height: 8px; border-radius: 999px; background: var(--bg-2); overflow: hidden; border: 1px solid var(--borde); }
  .barra > i { display: block; height: 100%; background: var(--dorado-grad); border-radius: 999px; }
  /* Analista (v2): señal, peldaños, chips de ganancia y control */
  .senal-palabra { font: var(--t-display); letter-spacing: -0.01em; }
  .senal-palabra.verde { color: var(--verde); }
  .senal-palabra.dorada {
    background: var(--dorado-grad); -webkit-background-clip: text;
    background-clip: text; color: transparent;
  }
  .senal-linea { width: 100%; text-align: left; cursor: pointer; color: var(--txt-1); font: var(--t-cuerpo); }
  .senal-linea:active { transform: scale(0.99); }
  .peldano { padding: var(--e-3) 0; border-bottom: 1px solid var(--borde); }
  .peldano:first-of-type { padding-top: var(--e-2); }
  .peldano:last-child { border-bottom: 0; padding-bottom: 0; }
  .peldano.bloqueado { opacity: 0.55; }
  .peldano-cab { display: flex; align-items: baseline; gap: var(--e-2); flex-wrap: wrap; }
  .peldano-nombre { font: var(--t-cuerpo-f); }
  .peldano-tasa { font: 600 20px/1.2 var(--fuente-num); font-variant-numeric: tabular-nums; margin-left: auto; }
  .peldano-tasa .unidad { font: var(--t-nota); color: var(--txt-2); font-family: var(--fuente); font-weight: 400; }
  .chip-g {
    display: inline-flex; align-items: center; padding: var(--e-1) var(--e-2);
    border-radius: var(--r-pildora); font: var(--t-micro); letter-spacing: 0.03em;
  }
  .chip-g.buena { background: var(--verde-suave); color: var(--verde); }
  .chip-g.fina { background: var(--ambar-suave); color: var(--ambar); }
  .chip-g.mala { background: var(--rojo-suave); color: var(--rojo); }
  .chip-g.neutra { background: var(--bg-2); color: var(--txt-2); }
  .campo-codigo {
    width: 100%; min-height: 48px; padding: 0 var(--e-3); margin: var(--e-2) 0;
    background: var(--bg-1); border: 1px solid var(--borde-fuerte);
    border-radius: var(--r-md); color: var(--txt-1); font: var(--t-cuerpo);
  }
  .anti-humo {
    margin-top: var(--e-4); padding: var(--e-3); border: 1px dashed var(--borde-fuerte);
    border-radius: var(--r-md); color: var(--txt-2); font: var(--t-sub);
  }
  .semaforo { display: flex; gap: var(--e-3); align-items: flex-start; }
  .semaforo .luz {
    width: 56px; height: 56px; border-radius: 999px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--borde-fuerte); background: var(--bg-2); color: var(--txt-3);
  }
  .semaforo .luz svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .semaforo.verde .luz { background: var(--verde-suave); color: var(--verde); border-color: var(--verde); }
  .semaforo.ambar .luz { background: var(--ambar-suave); color: var(--ambar); border-color: var(--ambar); }
  .mini-grafica { width: 100%; height: 72px; display: block; }
  .fila-hora { font: var(--t-nota); color: var(--txt-3); white-space: nowrap; }
  .pie-nota { font: var(--t-nota); color: var(--txt-3); margin-top: var(--e-3); }
  .aviso-banda { margin-bottom: var(--e-3); }
</style>
</head>

<script>
"use strict";
/* =====================================================================
   «Mercado» — la vigilancia del mercado QvaPay de Ernesto como app
   suya: un lector en SU Supabase guarda una foto cada 15 minutos y
   esta app la lee por puertas de SOLO LECTURA (mercado_ultima_foto,
   mercado_historial, mercado_promos, mercado_avisos). Su única
   escritura es el interruptor del Analista (mercado_acciones_control:
   DETENER / Reanudar), con su código de administrador.
   v2 (2026-11-11): el ANALISTA — todo su cálculo vive en el lector
   (detalle.analisis de cada foto); esta pantalla solo pinta.
   Honestidad de frescura siempre visible: dos relojes (origen del
   dato y recepción de la foto), sello FRESCA / VIEJA / RESPALDO y,
   sin conexión, la última foto guardada con «dato de hace X».
   El equilibrio sale de la TARIFA VIVA y del costo cargado en su
   base: sin costo, el número NO se inventa (se explica qué falta).
   ===================================================================== */
const MERCADO_VERSION = "v2";
const SELLO = "Mercado · versión 2026-11-11 18:52 · caché v2";
const SB_URL = "https://otsudfgwpapkluusrlnj.supabase.co";
const SB_KEY = "sb_publishable_Uchl5QnojJkZbXR5ar8vDg_5CXnqi_d"; // pública: solo lee por las puertas de mercado
const LS_CLAVE = "mercado_cache_v1";
const LS_CODIGO = "mercado_codigo_admin";
const RESPALDO_URL = "https://ernesto5058.github.io/calculadora-ernesto/datos/ultimo.json";

const S = { datos: null, errorRed: false, cargando: false, ultimoIntento: 0, confirmandoControl: null, controlError: null };

/* ---------------- utilidades ---------------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function num(x) { if (x === null || x === undefined || x === "") return null; const n = Number(x); return Number.isFinite(n) ? n : null; }
function fmt(x, dec) {
  const n = num(x); if (n === null) return "—";
  return n.toLocaleString("es-ES", { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 });
}
function fmtTasa(x) { return fmt(x, 2); }
const FMT_HORA = new Intl.DateTimeFormat("es-CU", { timeZone: "America/Havana", hour: "2-digit", minute: "2-digit" });
const FMT_DIA = new Intl.DateTimeFormat("es-CU", { timeZone: "America/Havana", day: "numeric", month: "short" });
function hora(iso) { if (!iso) return "—"; try { return FMT_HORA.format(new Date(iso)); } catch (e) { return "—"; } }
function diaHora(iso) { if (!iso) return "—"; try { return FMT_DIA.format(new Date(iso)) + " · " + FMT_HORA.format(new Date(iso)); } catch (e) { return "—"; } }
function haceTxt(iso) {
  if (!iso) return "sin hora";
  const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (min < 1) return "ahora mismo";
  if (min < 60) return "hace " + min + " min";
  const h = Math.floor(min / 60);
  if (h < 24) return "hace " + h + " h" + (min % 60 ? " " + (min % 60) + " min" : "");
  return "hace " + Math.floor(h / 24) + " días";
}
function edadMin(iso) { if (!iso) return Infinity; return (Date.now() - new Date(iso).getTime()) / 60000; }

/* ---------------- datos ---------------- */
async function rpc(nombre, args) {
  const r = await fetch(SB_URL + "/rest/v1/rpc/" + nombre, {
    method: "POST",
    headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args || {}),
  });
  if (!r.ok) throw new Error("puerta " + nombre + " HTTP " + r.status);
  return await r.json();
}
function guardarCache() {
  try { localStorage.setItem(LS_CLAVE, JSON.stringify({ datos: S.datos, guardadoEn: new Date().toISOString() })); } catch (e) {}
}
function leerCache() {
  try { const c = JSON.parse(localStorage.getItem(LS_CLAVE) || "null"); return c && c.datos ? c.datos : null; } catch (e) { return null; }
}

/* Si aún no hay fotos del lector, la primera foto es la del vigía del
   repo (datos/ultimo.json), marcada RESPALDO y VIEJA según su hora. */
async function fotoRespaldoRepo() {
  const r = await fetch(RESPALDO_URL, { cache: "no-store" });
  if (!r.ok) return null;
  const d = await r.json();
  const et = d.ETECSA || {}, bc = d.BANK_CUP || {};
  return {
    foto: {
      recibida_en: d.ts || null, origen_en: d.ts || null, origen: "respaldo",
      fresca: false, libro_ok: false,
      etecsa_top_compra: null, etecsa_nivel20: null, etecsa_top_venta: null,
      etecsa_promedio: num(et.average), etecsa_promedio_compra: num(et.average_buy),
      etecsa_promedio_venta: num(et.average_sell),
      etecsa_count: num(et.count), etecsa_count_buy: num(et.count_buy), etecsa_count_sell: num(et.count_sell),
      bankcup_promedio: num(bc.average), bankcup_count: num(bc.count),
      salida_ref: null, costo_ref: null, equilibrio: null,
    },
    estado: { demanda_pendiente: 0, demanda_alertada: false, lector_con_libro: false },
    config: { costo_ref360: null, umbral_count_buy: 25, umbral_nivel20: 300 },
    tarifa: null,
  };
}

async function cargar() {
  if (S.cargando) return;
  S.cargando = true; S.ultimoIntento = Date.now();
  const btn = $("btnRefrescar"); if (btn) btn.classList.add("girando");
  try {
    const [u, h, p, a] = await Promise.all([
      rpc("mercado_ultima_foto"), rpc("mercado_historial", { p_limite: 48 }),
      rpc("mercado_promos"), rpc("mercado_avisos"),
    ]);
    let ultima = u;
    if (!ultima || !ultima.foto) {
      const respaldo = await fotoRespaldoRepo().catch(() => null);
      if (respaldo) ultima = respaldo;
    }
    S.datos = { ultima, historial: Array.isArray(h) ? h : [], promos: Array.isArray(p) ? p : [], avisos: a || {} };
    S.errorRed = false;
    guardarCache();
  } catch (e) {
    S.errorRed = true;
    if (!S.datos) S.datos = leerCache();
  }
  S.cargando = false;
  if (btn) btn.classList.remove("girando");
  renderTodo();
}

/* ---------------- estado del dato (frescura honesta) ---------------- */
/* Devuelve {clase, texto}: fresca (verde) · vieja (rojo) · respaldo (ámbar). */
function estadoDato(foto) {
  if (!foto) return { clase: "neutro", texto: "SIN DATOS" };
  const vieja = edadMin(foto.origen_en || foto.recibida_en) > 30 || edadMin(foto.recibida_en) > 45;
  if (vieja) return { clase: "vieja", texto: "DATO VIEJO" };
  if (!foto.libro_ok || foto.origen === "respaldo") return { clase: "respaldo", texto: "RESPALDO · SIN LIBRO" };
  return { clase: "fresca", texto: "FRESCA" };
}
function bandaRed() {
  if (!S.errorRed) return "";
  const f = S.datos && S.datos.ultima && S.datos.ultima.foto;
  return '<div class="aviso error aviso-banda">Sin conexión ahora: te muestro la última foto guardada' +
    (f ? ", recibida " + haceTxt(f.recibida_en) : "") + ".</div>";
}
/* Sin datos y con error de red: error en palabras claras (estado
   obligatorio del DISENO-PRO), nunca un esqueleto eterno. */
function sinDatos() {
  if (S.errorRed) return '<div class="aviso error">No pude leer tu servidor y no hay ninguna ' +
    'foto guardada en este teléfono. Revisa la conexión y toca el botón de actualizar.</div>';
  return esqueleto();
}
function esqueleto() {
  return '<div class="esqueleto" style="height:120px;border-radius:var(--r-xl);margin-bottom:var(--e-3)"></div>' +
         '<div class="esqueleto" style="height:84px;border-radius:var(--r-lg)"></div>';
}
function fotoActual() { return S.datos && S.datos.ultima ? S.datos.ultima.foto : null; }
function analisisActual() {
  const f = fotoActual();
  return f && f.detalle && f.detalle.analisis ? f.detalle.analisis : null;
}
function accionesActual() {
  const u = S.datos && S.datos.ultima ? S.datos.ultima : {};
  return u.acciones || { detenidas: false, pausadas: false, pausa_motivo: null, monto_qusd: 40 };
}
function fmtPct(x, dec) {
  const n = num(x); if (n === null) return "—";
  return fmt(n * 100, dec === undefined ? 1 : dec) + " %";
}
function fmtSigno(x) {
  const n = num(x); if (n === null) return "—";
  return (n > 0 ? "+" : "") + fmt(n, 2);
}

/* ---------------- pantalla: Ahora ---------------- */
function renderAhora() {
  const el = $("ctAhora"); if (!el) return;
  if (!S.datos) { el.innerHTML = sinDatos(); return; }
  const u = S.datos.ultima || {}, f = u.foto;
  let h = bandaRed() + '<p class="explica">El mercado QvaPay ahora mismo, leído por tu propio servidor cada 15 minutos.</p>';
  if (!f) {
    el.innerHTML = h + '<div class="estado"><div class="estado-tit">Todavía no hay fotos del mercado</div>' +
      '<p>Tu lector guarda la primera foto en su próxima lectura. Vuelve en unos minutos.</p></div>';
    return;
  }
  const ed = estadoDato(f);
  const heroeValor = num(f.etecsa_nivel20) !== null ? f.etecsa_nivel20 : f.etecsa_promedio;
  const heroeEtiqueta = num(f.etecsa_nivel20) !== null ? "NIVEL DE 20 USD · ETECSA" : "PROMEDIO 24 H · ETECSA";
  h += '<div class="card heroe">' +
    '<div class="etiqueta">' + heroeEtiqueta + '</div>' +
    '<div class="heroe-num">' + fmtTasa(heroeValor) + ' <span class="unidad">saldo por QUSD</span></div>' +
    '<div style="margin-top:var(--e-3);display:flex;gap:var(--e-2);flex-wrap:wrap;align-items:center">' +
      '<span class="sello ' + ed.clase + '"><span class="punto"></span>' + ed.texto + '</span>' +
      '<span class="t-nota" style="color:var(--txt-3)">Foto ' + hora(f.recibida_en) + ' · dato de origen ' + hora(f.origen_en) + ' (' + haceTxt(f.origen_en || f.recibida_en) + ')</span>' +
    '</div>' +
    (num(f.etecsa_nivel20) === null
      ? '<p class="pie-nota">Sin libro todavía: esto es el promedio de operaciones reales. El nivel de 20 USD llega cuando el lector tenga las credenciales de tu app «Vigila Mercado».</p>'

/* ---------------- pantalla: Historial ---------------- */
function renderHistorial() {
  const el = $("ctHistorial"); if (!el) return;
  if (!S.datos) { el.innerHTML = sinDatos(); return; }
  const hist = (S.datos.historial || []).slice();
  let h = bandaRed() + '<p class="explica">Cada foto que tu lector guarda, una cada 15 minutos: así se ve el mercado moverse.</p>';
  if (!hist.length) {
    h += '<div class="estado"><div class="estado-tit">Historial vacío</div><p>Las fotos se acumulan solas con cada lectura de tu lector.</p></div>';
    el.innerHTML = h; return;
  }
  /* Mini-gráfica: línea del promedio ETECSA (o nivel20) foto a foto */
  const serie = hist.slice().reverse()
    .map((x) => ({ t: x.recibida_en, v: num(x.etecsa_nivel20) !== null ? num(x.etecsa_nivel20) : num(x.etecsa_promedio) }))
    .filter((x) => x.v !== null);
  if (serie.length >= 2) {
    const W = 320, H = 72, PAD = 6;
    const vs = serie.map((x) => x.v);
    const min = Math.min.apply(null, vs), max = Math.max.apply(null, vs), rango = (max - min) || 1;
    const pts = serie.map((x, i) => {
      const px = PAD + (i / (serie.length - 1)) * (W - PAD * 2);
      const py = H - PAD - ((x.v - min) / rango) * (H - PAD * 2);
      return px.toFixed(1) + "," + py.toFixed(1);
    }).join(" ");
    h += '<div class="card"><div class="etiqueta">NIVEL / PROMEDIO ETECSA · SALDO POR QUSD</div>' +
      '<svg class="mini-grafica" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="margin-top:var(--e-2)">' +
      '<polyline points="' + pts + '" fill="none" stroke="var(--dorado)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>' +
      '<div style="display:flex;justify-content:space-between"><span class="t-nota" style="color:var(--txt-3)">' + diaHora(serie[0].t) + '</span>' +
      '<span class="t-nota" style="color:var(--txt-3)">máx ' + fmtTasa(max) + ' · mín ' + fmtTasa(min) + '</span>' +
      '<span class="t-nota" style="color:var(--txt-3)">' + diaHora(serie[serie.length - 1].t) + '</span></div></div>';
  }
  h += '<div class="seccion-tit">Fotos guardadas</div><div class="card lista" style="padding:0 var(--e-4)">';
  for (const x of hist) {
    const ed = x.libro_ok ? (x.fresca ? "FRESCA" : "VIEJA") : "RESPALDO";
    const col = ed === "FRESCA" ? "var(--verde)" : (ed === "VIEJA" ? "var(--rojo)" : "var(--ambar)");
    h += '<div class="fila"><div class="fila-cuerpo">' +
      '<div class="fila-tit num">' + fmtTasa(x.etecsa_nivel20 !== null && x.etecsa_nivel20 !== undefined ? x.etecsa_nivel20 : x.etecsa_promedio) + ' saldo por QUSD</div>' +
      '<div class="fila-sub">Compras ' + fmt(x.etecsa_count_buy) + ' · ' + (num(x.equilibrio) !== null ? "equilibrio " + fmtTasa(x.equilibrio) : "sin equilibrio") + '</div></div>' +
      '<div style="text-align:right"><div class="fila-hora">' + diaHora(x.recibida_en) + '</div>' +
      '<div class="etiqueta" style="color:' + col + '">' + ed + '</div></div></div>';
  }
  h += '</div>';
  el.innerHTML = h;
}

function codigoGuardado() {
  try { return localStorage.getItem(LS_CODIGO) || ""; } catch (e) { return ""; }
}
async function ejecutarControl(modo) {
  const inp = $("inputCodigo");
  const codigo = (inp && inp.value.trim()) || codigoGuardado();
  if (!codigo) { S.controlError = "Escribe tu código de administrador."; renderAnalista(); return; }
  try {
    const r = await rpc("mercado_acciones_control", { p_codigo: codigo, p_modo: modo });
    if (r && r.ok) {
      try { localStorage.setItem(LS_CODIGO, codigo); } catch (e) {}
      if (S.datos && S.datos.ultima) {
        S.datos.ultima.acciones = Object.assign({}, accionesActual(), {
          detenidas: r.detenidas === true, pausadas: r.pausadas === true,
          pausa_motivo: modo === "reanudar" ? null : accionesActual().pausa_motivo,
        });
        guardarCache();
      }
      S.confirmandoControl = null; S.controlError = null;
    } else {
      S.controlError = "Código no válido: revísalo e inténtalo otra vez.";
      try { localStorage.removeItem(LS_CODIGO); } catch (e) {}
    }
  } catch (e) {
    S.controlError = "Sin conexión: el cambio no se guardó. Inténtalo cuando vuelva la red.";
  }
  renderAnalista();
}
function enlazarControl() {
  const bd = $("btnDetener"), br = $("btnReanudar");
  const bc = $("btnConfirmarControl"), bx = $("btnCancelarControl");
  if (bd) bd.addEventListener("click", () => { S.confirmandoControl = "detener"; S.controlError = null; renderAnalista(); });
  if (br) br.addEventListener("click", () => {
    if (codigoGuardado()) { ejecutarControl("reanudar"); }
    else { S.confirmandoControl = "reanudar"; S.controlError = null; renderAnalista(); }
  });
  if (bc) bc.addEventListener("click", () => ejecutarControl(S.confirmandoControl));
  if (bx) bx.addEventListener("click", () => { S.confirmandoControl = null; S.controlError = null; renderAnalista(); });
}

function renderAnalista() {
  const el = $("ctAnalista"); if (!el) return;
  if (!S.datos) { el.innerHTML = sinDatos(); return; }
  const u = S.datos.ultima || {}, f = u.foto;
  let h = bandaRed() + '<p class="explica">Tu analista lee el libro de ahora y aplica TUS reglas con TU tarifa: menú de tasas, precio ejecutable, transferencia y ofertas duras.</p>';
  h += tarjetaControl();
  if (!f) {
    el.innerHTML = h + '<div class="estado" style="margin-top:var(--e-3)"><div class="estado-tit">Todavía no hay fotos del mercado</div>' +
      '<p>El Analista se calcula con la primera foto de tu lector.</p></div>';
    enlazarControl(); return;
  }
  const an = f.detalle && f.detalle.analisis ? f.detalle.analisis : null;
  if (!an) {
    el.innerHTML = h + '<div class="estado" style="margin-top:var(--e-3)"><div class="estado-tit">El Analista se estrena con la próxima foto</div>' +
      '<p>Esta foto la guardó tu lector antes del Analista. La próxima (en ~15 min) ya trae el menú, la señal y las duras.</p></div>' +
      '<p class="anti-humo">Esto no predice el mercado: lee el libro de ahora y aplica TUS reglas con TU tarifa. Cada número lleva su hora. La oferta la pones tú.</p>';
    enlazarControl(); return;
  }
  const ed = estadoDato(f);
  const vieja = ed.clase === "vieja";
  if (vieja) {
    h += '<div class="aviso error aviso-banda" style="margin-top:var(--e-3)">Foto vieja: recibida ' + haceTxt(f.recibida_en) +
      '. La señal y el menú de abajo son de esa foto y pueden no valer ya.</div>';
  } else if (!f.libro_ok) {
    h += '<div class="aviso info aviso-banda" style="margin-top:var(--e-3)">Esta foto no trae el libro (modo respaldo): el Analista no concluye sin libro.</div>';
  }
  if (an.promoActiva) {
    h += '<div class="aviso info aviso-banda" style="margin-top:var(--e-3)">Promo de ETECSA activa: «' + esc(an.promoActiva.titulo) + '»' +
      (an.promoActiva.hasta ? " (hasta el " + esc(an.promoActiva.hasta) + ")" : "") +
      '. Las acciones están congeladas por tu regla; el análisis sigue.</div>';
  }
  /* --- Señal --- */
  const s = an.senal || {};
  const palabra = s.palabra || "SIN CONCLUSIÓN";
  const clasePalabra = s.palabra === "VENDER" ? "verde" : (s.palabra === "APROVECHAR" ? "dorada" : "");
  const n = s.numeros || {};
  h += '<div class="card heroe" style="margin-top:var(--e-3)">' +
    '<div class="etiqueta">SEÑAL · VALE HASTA LA PRÓXIMA FOTO</div>' +
    '<div class="senal-palabra ' + clasePalabra + '">' + esc(palabra) + '</div>' +
    '<div class="rejilla2" style="margin-top:var(--e-3);grid-template-columns:1fr 1fr 1fr;gap:var(--e-2)">' +
      '<div><div class="etiqueta">TASA</div><div class="num" style="font:600 17px/1.25 var(--fuente-num)">' + fmtTasa(n.tasa) + '</div></div>' +
      '<div><div class="etiqueta">GANANCIA /360</div><div class="num" style="font:600 17px/1.25 var(--fuente-num)">' + (num(n.ganancia360) === null ? "—" : fmtSigno(n.ganancia360)) + '</div></div>' +
      '<div><div class="etiqueta">EQUILIBRIO</div><div class="num" style="font:600 17px/1.25 var(--fuente-num)">' + fmtTasa(n.equilibrio) + '</div></div>' +
    '</div>' +
    '<p class="pie-nota">' + esc(s.motivo || "") + '</p>' +
    '<p class="pie-nota">Foto ' + hora(f.recibida_en) + ' · dato de origen ' + hora(f.origen_en) + ' (' + haceTxt(f.origen_en || f.recibida_en) + ') · sello: ' + ed.texto + '.</p>' +
  '</div>';
  /* --- Menú maker --- */
  const menu = an.menu || { peldanos: [] };
  h += '<div class="card" style="margin-top:var(--e-3)"><div class="card-titulo">Publicar tu venta · los 3 peldaños</div>';
  for (const p of menu.peldanos) {
    let chip = "";
    if (p.bloqueado) chip = '<span class="chip-g mala">BLOQUEADO</span>';
    else if (p.zona === "fina") chip = '<span class="chip-g fina">' + fmtSigno(p.g) + ' CUP · FINA, SOLO CON TU TOQUE</span>';
    else chip = '<span class="chip-g buena">' + fmtSigno(p.g) + ' CUP / 360</span>';
    h += '<div class="peldano' + (p.bloqueado ? " bloqueado" : "") + '">' +
      '<div class="peldano-cab"><span class="peldano-nombre">' + esc(p.nombre) + '</span>' + chip +
      '<span class="peldano-tasa">' + (num(p.tasa) === null ? "—" : fmtTasa(p.tasa)) + ' <span class="unidad">saldo/QUSD</span></span></div>' +
      (p.bloqueado
        ? '<div class="t-sub" style="color:var(--rojo);margin-top:var(--e-1)">' + esc(p.motivo || "") + '</div>'
        : '<div class="t-nota" style="color:var(--txt-3);margin-top:var(--e-1)">Por delante en el libro de venta: $' + fmt(p.delanteUsd, 0) + ' USD · ' + esc(p.explica || "") + '</div>') +
    '</div>';
  }
  h += '<p class="pie-nota">«Por delante» = los USD del libro de venta en tasas mayores que la del peldaño: lo que se vendería antes que tu oferta. A más por delante, más espera.</p></div>';
  /* --- Precio ejecutable --- */
  const ej = an.ejecutable || {};
  h += '<div class="card" style="margin-top:var(--e-3)"><div class="card-titulo">Si vendes ahora (precio ejecutable)</div>';
  if (ej.usd20) {
    h += '<p style="margin:0">A $20: tasa ejecutable <b class="num">' + fmtTasa(ej.usd20.tasa) + ' saldo por QUSD</b> — por cada 360 de saldo recibes <b class="num">' +
      fmt(360 / ej.usd20.tasa, 2) + ' QUSD</b>.</p>' +
      '<p class="pie-nota">Es recorrer el libro de compra de verdad, nivel a nivel: no es un promedio.</p>';
  } else if (ej.parcial20) {
    h += '<p style="margin:0">El libro de compra no junta $20: solo hay <b class="num">$' + fmt(ej.parcial20.usd, 0) +
      ' USD</b>, ejecutables a <b class="num">' + fmtTasa(ej.parcial20.tasa) + ' saldo por QUSD</b>.</p>' +
      '<p class="pie-nota">Sin profundidad no hay tasa ejecutable: el Analista lo dice en vez de inventarla.</p>';
  } else {
    h += '<p style="margin:0">El libro de compra está vacío en esta foto.</p>';
  }
  if (ej.usdAccion) {
    h += '<p class="t-sub" style="color:var(--txt-2);margin:var(--e-2) 0 0">A $' + fmt(ej.montoAccion, 0) + ' (tu monto de acción): tasa ejecutable <b class="num">' + fmtTasa(ej.usdAccion.tasa) + '</b>.</p>';
  }
  h += '</div>';
  /* --- Transferencia --- */
  const tr = an.transferencia;
  h += '<div class="card" style="margin-top:var(--e-3)"><div class="card-titulo">Transferencia · comprar QUSD</div>';
  if (tr) {
    h += '<p style="margin:0">Comprar QUSD por transferencia cuesta <b class="num">' + fmtTasa(tr.bEj) + ' CUP por QUSD</b>' +
      (tr.esPromedio ? ' <span class="chip-g neutra">PROMEDIO 24 H</span>' : ' <span class="chip-g neutra">DEL LIBRO</span>') + '</p>' +
      '<p class="t-sub" style="color:var(--txt-2);margin:var(--e-2) 0 0">Para empatar necesitas un descuento de <b>' + fmtPct(tr.dMin) + '</b> — en la calle se dice <b>«al ' + fmtPct(tr.primaMin, 1).replace(" %", "") + ' %»</b>.</p>' +
      '<p class="t-sub" style="color:var(--txt-2);margin:var(--e-2) 0 0">Si te hacen el 20 % de descuento («al 25 %»): puedes pagar hasta <b class="num">' + fmtTasa(tr.bMax20) + ' CUP por QUSD</b> y ganas <b class="num">' + fmtTasa(tr.gananciaQusd20) + ' CUP por QUSD</b>.</p>' +
      '<p class="pie-nota">El descuento y la prima «al %» son el mismo número en dos idiomas: pagar 7 000 por transferencia por 5 000 en efectivo es «al 40 %» y equivale a un descuento del 28,6 %.</p>';
  } else {
    h += '<p style="margin:0">Sin precio de BANK_CUP en esta foto: el bloque se calcula cuando haya libro o promedio.</p>';
  }
  h += '</div>';
  /* --- Ofertas duras vigentes --- */
  const duras = an.duras || [];
  h += '<div class="card" style="margin-top:var(--e-3)"><div class="card-titulo">Ofertas duras en esta foto</div>';
  if (!duras.length) {
    h += '<p class="t-sub" style="color:var(--txt-2);margin:0">Ninguna ahora. Cuando una aparezca, te llega por Telegram al momento, con su foto y su hora.</p>';
  } else {
    for (const d of duras) {
      const esCompra = d.lado === "compra";
      h += '<div class="peldano"><div class="peldano-cab">' +
        '<span class="chip-g ' + (esCompra ? "buena" : "fina") + '">' + (esCompra ? "COMPRA DURA" : "VENTA ANÓMALA") + '</span>' +
        '<span class="peldano-tasa">' + fmtTasa(d.tasa) + ' <span class="unidad">saldo/QUSD</span></span></div>' +
        '<div class="t-nota" style="color:var(--txt-3);margin-top:var(--e-1)">$' + fmt(d.usd, 0) + ' USD · ' +
        (esCompra ? ("venderle = " + fmtSigno(d.g360) + " CUP por recarga de 360") : ("vuelta interna bruta +" + fmt(d.vueltaPct, 1) + " %")) +
        ' · contraparte: ' + esc(d.marca || "—") + '</div></div>';
    }
  }
  if (an.durasDescartadas && an.durasDescartadas.length) {
    h += '<p class="pie-nota">' + an.durasDescartadas.length + ' oferta(s) dura(s) se descartaron por contraparte floja: no se avisan como duras.</p>';
  }
  h += '</div>';
  h += '<p class="anti-humo">' + esc(an.textoAntiHumo || "") + '</p>';
  el.innerHTML = h;
  enlazarControl();
}

/* ---------------- navegación y arranque ---------------- */
function activarPantalla(pgId) {
  document.querySelectorAll("#tabbar .tab").forEach((x) => x.classList.toggle("activa", x.dataset.pg === pgId));
  document.querySelectorAll(".pantalla").forEach((p) => p.classList.toggle("activa", p.id === pgId));
  window.scrollTo(0, 0);
}
function renderTodo() {
  const selloEl = $("selloVersion");
  if (selloEl) selloEl.textContent = SELLO;
  renderAhora(); renderAnalista(); renderEquilibrio(); renderDemanda(); renderPromos(); renderHistorial(); renderAvisos();
  document.querySelectorAll(".js-ir-analista").forEach((b) => {
    b.addEventListener("click", () => activarPantalla("pgAnalista"));
  });
  const cab = $("cabSub");
  const f = fotoActual();
  if (cab) cab.textContent = f ? ("Foto " + haceTxt(f.recibida_en) + " · " + estadoDato(f).texto.toLowerCase()) : "Tu vigía del mercado QvaPay";
}
document.querySelectorAll("#tabbar .tab").forEach((b) => {
  b.addEventListener("click", () => activarPantalla(b.dataset.pg));
});
$("btnRefrescar").addEventListener("click", cargar);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - S.ultimoIntento > 60000) cargar();
});
if ("serviceWorker" in navigator) {
  try { navigator.serviceWorker.register("sw.js"); } catch (e) {}
}
S.datos = leerCache();
renderTodo();
cargar();

</script>
</body>
</html>
